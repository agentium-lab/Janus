server:
  http_port: 8080
  grpc_port: 9090

nats:
  url: "nats://localhost:4222"

postgres:
  host: "localhost"
  port: 5432
  user: "janus"
  password: "${JANUS_PG_PASSWORD}"
  database: "janus"
  max_conns: 20

cache:
  driver: "redis"
  mode: "standalone"
  addr: "localhost:6379"
  sentinel:
    master_name: "mymaster"
    addrs:
      - "sentinel1:26379"
      - "sentinel2:26379"
      - "sentinel3:26379"
  cluster:
    addrs:
      - "node1:6379"
      - "node2:6379"
      - "node3:6379"
  password: "${JANUS_CACHE_PASSWORD}"
  db: 0
  pool_size: 100

log:
  level: "info"
  format: "json"

migration:
  auto: true
  path: "migrations/"

heartbeat:
  sweeper_interval: "30s"
  ttl: "60s"

outbox:
  enable: true
  poll_interval: "500ms"
  idle_backoff_max: "5s"
  batch_size: 100
  lease_duration: "60s"
  max_retries: 5
  listen_notify: true

observability:
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: false
    endpoint: ""
    service_name: "janus-api"
    insecure: true

llm:
  enabled: false
  provider: "openai"
  model: "gpt-4o-mini"
  api_key: "${JANUS_LLM_API_KEY}"
  base_url: "https://api.openai.com/v1"
  max_tokens: 200
  timeout_seconds: 5
