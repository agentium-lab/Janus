syntax = "proto3";

package janus.v1;

option go_package = "github.com/agentium-lab/Janus/proto/gen/janus/v1;janusv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "janus/v1/common.proto";

message CreateTaskRequest {
  string tenant_id = 1;
  TaskEnvelope envelope = 2;
}

message GetTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
}

message CancelTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
  string reason = 3;
}

message ReplayTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
  string target_mailbox_id = 3;
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (Task) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/tasks" body: "*" };
  }
  rpc GetTask(GetTaskRequest) returns (Task) {
    option (google.api.http) = { get: "/v1/tenants/{tenant_id}/tasks/{task_id}" };
  }
  rpc CancelTask(CancelTaskRequest) returns (Task) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/tasks/{task_id}/cancel" body: "*" };
  }
  rpc ReplayTask(ReplayTaskRequest) returns (Task) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/tasks/{task_id}/replay" body: "*" };
  }
}
