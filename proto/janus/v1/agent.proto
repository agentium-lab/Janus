syntax = "proto3";

package janus.v1;

option go_package = "github.com/agentium-lab/Janus/proto/gen/janus/v1;janusv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "janus/v1/common.proto";

message AgentCapability {
  string capability = 1;
  string description = 2;
}

message Agent {
  string id = 1;
  string tenant_id = 2;
  string display_name = 3;
  string protocol = 4;
  string endpoint = 5;
  string status = 6;
  string description = 7;
  repeated AgentCapability capabilities = 8;
  int32 max_concurrency = 9;
  int32 rpm = 10;
  int32 tpm = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp last_heartbeat_at = 14;
  string team_id = 15;
}

message RegisterAgentRequest {
  string tenant_id = 1;
  string id = 2;
  string display_name = 3;
  string protocol = 4;
  string endpoint = 5;
  string description = 6;
  repeated AgentCapability capabilities = 7;
  int32 max_concurrency = 8;
  int32 rpm = 9;
  int32 tpm = 10;
  string team_id = 11;
}

message UpdateAgentRequest {
  string tenant_id = 1;
  string agent_id = 2;
  optional string display_name = 3;
  optional string endpoint = 4;
  optional string description = 5;
  optional string status = 6;
  repeated AgentCapability capabilities = 7;
  optional int32 max_concurrency = 8;
  optional int32 rpm = 9;
  optional int32 tpm = 10;
}

message HeartbeatRequest {
  string tenant_id = 1;
  string agent_id = 2;
}

message HeartbeatResponse {
  google.protobuf.Timestamp server_time = 1;
}

message ListAgentsRequest {
  string tenant_id = 1;
  string status = 2;
  string capability = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
}

message GetAgentRequest {
  string tenant_id = 1;
  string agent_id = 2;
}

service AgentService {
  rpc RegisterAgent(RegisterAgentRequest) returns (Agent) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/agents" body: "*" };
  }
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent) {
    option (google.api.http) = { patch: "/v1/tenants/{tenant_id}/agents/{agent_id}" body: "*" };
  }
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/agents/{agent_id}/heartbeat" body: "*" };
  }
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.http) = { get: "/v1/tenants/{tenant_id}/agents" };
  }
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = { get: "/v1/tenants/{tenant_id}/agents/{agent_id}" };
  }
}
