syntax = "proto3";

package janus.v1;

option go_package = "github.com/agentium-lab/Janus/proto/gen/janus/v1;janusv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/api/annotations.proto";
import "janus/v1/common.proto";

message PullTaskRequest {
  string tenant_id = 1;
  string mailbox_id = 2;
  int32 max_messages = 3;
  google.protobuf.Duration wait_time = 4;
  string agent_id = 5;
}

message Lease {
  string lease_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message PullTaskResponse {
  Task task = 1;
  Lease lease = 2;
}

message StartTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
  string lease_id = 3;
}

message StartTaskResponse {}

message TaskHeartbeatRequest {
  string tenant_id = 1;
  string task_id = 2;
  string lease_id = 3;
}

message TaskHeartbeatResponse {}

message AckTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
  string lease_id = 3;
  string result_ref = 4;
  TokenUsage token_usage = 5;
}

message AckTaskResponse {}

message NackTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
  string lease_id = 3;
  bool retriable = 4;
  TaskError error = 5;
}

message NackTaskResponse {}

service DispatchService {
  rpc PullTask(PullTaskRequest) returns (PullTaskResponse) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/mailboxes/{mailbox_id}/pull" body: "*" };
  }
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/tasks/{task_id}/start" body: "*" };
  }
  rpc TaskHeartbeat(TaskHeartbeatRequest) returns (TaskHeartbeatResponse) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/tasks/{task_id}/heartbeat" body: "*" };
  }
  rpc AckTask(AckTaskRequest) returns (AckTaskResponse) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/tasks/{task_id}/ack" body: "*" };
  }
  rpc NackTask(NackTaskRequest) returns (NackTaskResponse) {
    option (google.api.http) = { post: "/v1/tenants/{tenant_id}/tasks/{task_id}/nack" body: "*" };
  }
}
