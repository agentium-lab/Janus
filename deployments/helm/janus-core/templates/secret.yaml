apiVersion: v1
kind: Secret
metadata:
  name: {{ include "janus-core.fullname" . }}
  labels:
    {{- include "janus-core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
  password: {{ .Values.postgres.password | b64enc | quote }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  llm-api-key: {{ .Values.config.llm.apiKey | default "" | b64enc | quote }}
