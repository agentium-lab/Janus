{{- $rwoReplicas := gt (int .Values.replicaCount) 1 }}
{{- if .Values.autoscaling.enabled }}
{{- $rwoReplicas = or $rwoReplicas (gt (int .Values.autoscaling.minReplicas) 1) (gt (int .Values.autoscaling.maxReplicas) 1) }}
{{- end }}
{{- if and .Values.artifacts.enabled (eq .Values.artifacts.accessMode "ReadWriteOnce") $rwoReplicas }}
{{- fail "artifacts: ReadWriteOnce storage cannot serve more than one replica — replicaCount, autoscaling.minReplicas and autoscaling.maxReplicas must all be 1 (HPA scales past PVC multi-attach limits). Switch accessMode to ReadWriteMany (shared FS), use object storage for result refs, or disable autoscaling." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "janus-core.fullname" . }}
  labels:
    {{- include "janus-core.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "janus-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "janus-core.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "janus-core.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.config.grpcPort }}
              protocol: TCP
          env:
            - name: JANUS_HTTP_PORT
              value: "{{ .Values.config.httpPort }}"
            - name: JANUS_GRPC_PORT
              value: "{{ .Values.config.grpcPort }}"
            - name: JANUS_PG_HOST
              value: "{{ .Values.postgres.host }}"
            - name: JANUS_PG_PORT
              value: "{{ .Values.postgres.port }}"
            - name: JANUS_PG_USER
              value: "{{ .Values.postgres.user }}"
            - name: JANUS_PG_DATABASE
              value: "{{ .Values.postgres.database }}"
            - name: JANUS_PG_MAX_CONNS
              value: "{{ .Values.postgres.maxConns }}"
            - name: JANUS_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "janus-core.postgresPasswordSecret" . }}
                  key: {{ .Values.postgres.secretKey }}
            - name: JANUS_QUEUE_DRIVER
              value: "{{ .Values.queue.driver }}"
            - name: JANUS_NATS_URL
              {{- if .Values.nats.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.existingSecret }}
                  key: url
              {{- else }}
              value: "{{ .Values.nats.url }}"
              {{- end }}
            - name: JANUS_REDIS_ADDR
              value: "{{ .Values.redis.addr }}"
            - name: JANUS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "janus-core.redisPasswordSecret" . }}
                  key: {{ .Values.redis.secretKey }}
            - name: JANUS_REDIS_DB
              value: "{{ .Values.redis.db }}"
            - name: JANUS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "janus-core.fullname" . }}
                  key: llm-api-key
            - name: JANUS_REDIS_ENABLE_TLS
              value: "{{ .Values.redis.enableTLS | default false }}"
            - name: JANUS_MIGRATION_AUTO
              value: "false"
            - name: JANUS_MIGRATION_PATH
              value: "{{ .Values.config.migration.path }}"
            - name: JANUS_HB_SWEEPER_INTERVAL
              value: "{{ .Values.config.heartbeat.sweeperInterval }}"
            - name: JANUS_HB_TTL
              value: "{{ .Values.config.heartbeat.ttl }}"
            - name: JANUS_AUTH_ENABLED
              value: "{{ .Values.config.auth.enabled }}"
            - name: JANUS_TLS_ENABLED
              value: "{{ .Values.config.tls.enabled }}"
            {{- if .Values.config.tls.enabled }}
            - name: JANUS_TLS_CERT_FILE
              value: "/etc/janus/tls/tls.crt"
            - name: JANUS_TLS_KEY_FILE
              value: "/etc/janus/tls/tls.key"
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.clientCaSecret }}
            - name: JANUS_TLS_CLIENT_CA_FILE
              value: "/etc/janus/client-ca/ca.crt"
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.gatewayCaSecret }}
            - name: JANUS_TLS_GATEWAY_CA_CERT_FILE
              value: "/etc/janus/gateway-ca/ca.crt"
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.gateway.serverName }}
            - name: JANUS_TLS_GATEWAY_SERVER_NAME
              value: {{ .Values.config.tls.gateway.serverName | quote }}
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.gateway.clientCertSecret }}
            - name: JANUS_TLS_GATEWAY_CLIENT_CERT_FILE
              value: "/etc/janus/gateway-client/tls.crt"
            - name: JANUS_TLS_GATEWAY_CLIENT_KEY_FILE
              value: "/etc/janus/gateway-client/tls.key"
            {{- end }}
            - name: JANUS_CONFIG_FILE
              value: "/etc/janus/janus.yaml"
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
          {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- if .Values.probes.liveness.enabled }}
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
              {{- if .Values.config.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            {{- end }}
          readinessProbe:
            {{- if .Values.probes.readiness.enabled }}
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
              {{- if .Values.config.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/janus
            {{- if .Values.config.tls.enabled }}
            - name: tls
              mountPath: /etc/janus/tls
              readOnly: true
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.clientCaSecret }}
            - name: client-ca
              mountPath: /etc/janus/client-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.gatewayCaSecret }}
            - name: gateway-ca
              mountPath: /etc/janus/gateway-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.gateway.clientCertSecret }}
            - name: gateway-client
              mountPath: /etc/janus/gateway-client
              readOnly: true
            {{- end }}
            {{- if .Values.artifacts.enabled }}
            - name: artifacts
              mountPath: {{ .Values.artifacts.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "janus-core.fullname" . }}
        {{- if .Values.config.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.config.tls.existingSecret | default (printf "%s-tls" (include "janus-core.fullname" .)) }}
        {{- end }}
        {{- if and .Values.config.tls.enabled .Values.config.tls.clientCaSecret }}
        - name: client-ca
          secret:
            secretName: {{ .Values.config.tls.clientCaSecret }}
        {{- end }}
        {{- if and .Values.config.tls.enabled .Values.config.tls.gatewayCaSecret }}
        - name: gateway-ca
          secret:
            secretName: {{ .Values.config.tls.gatewayCaSecret }}
        {{- end }}
        {{- if and .Values.config.tls.enabled .Values.config.tls.gateway.clientCertSecret }}
        - name: gateway-client
          secret:
            secretName: {{ .Values.config.tls.gateway.clientCertSecret }}
        {{- end }}
        {{- if .Values.artifacts.enabled }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "janus-core.fullname" . }}-artifacts
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
