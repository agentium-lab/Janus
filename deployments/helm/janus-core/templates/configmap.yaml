apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "janus-core.fullname" . }}
  labels:
    {{- include "janus-core.labels" . | nindent 4 }}
data:
  janus.yaml: |
    http_port: {{ .Values.config.httpPort }}
    grpc_port: {{ .Values.config.grpcPort }}
    auth:
      enabled: {{ .Values.config.auth.enabled }}
    tls:
      enabled: {{ .Values.config.tls.enabled }}
    heartbeat:
      sweeper_interval: {{ .Values.config.heartbeat.sweeperInterval | quote }}
      ttl: {{ .Values.config.heartbeat.ttl | quote }}
    migration:
      auto: false
      path: {{ .Values.config.migration.path | quote }}
    postgres:
      host: {{ .Values.postgres.host | quote }}
      port: {{ .Values.postgres.port }}
      user: {{ .Values.postgres.user | quote }}
      database: {{ .Values.postgres.database | quote }}
      max_conns: {{ .Values.postgres.maxConns }}
    nats:
      url: {{ .Values.nats.url | quote }}
    redis:
      addr: {{ .Values.redis.addr | quote }}
      db: {{ .Values.redis.db }}
    llm:
      enabled: {{ .Values.config.llm.enabled | default false }}
      provider: {{ .Values.config.llm.provider | default "openai" | quote }}
      model: {{ .Values.config.llm.model | default "gpt-4o-mini" | quote }}
      api_key: {{ .Values.config.llm.apiKey | default "" | quote }}
      base_url: {{ .Values.config.llm.baseUrl | default "https://api.openai.com/v1" | quote }}
      max_tokens: {{ .Values.config.llm.maxTokens | default 200 }}
      timeout_seconds: {{ .Values.config.llm.timeoutSeconds | default 5 }}
