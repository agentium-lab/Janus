apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "janus-core.fullname" . }}-migration
  labels:
    {{- include "janus-core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "janus-core.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "janus-core.serviceAccountName" . }}-migration
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migration
          image: "migrate/migrate:v4.19.1"
          imagePullPolicy: IfNotPresent
          # The DB password arrives at RUNTIME from the JANUS_PG_PASSWORD env
          # var, so Helm's urlquery cannot escape it. Percent-encode the URI
          # delimiters (% must go first) in POSIX sh before building the DSN;
          # a raw # ? / @ % or space breaks the URI parse inside migrate.
          # This mirrors server/internal/config DSN()'s url.QueryEscape.
          command:
            - /bin/sh
            - -ec
            - |
              ESCAPED_PASSWORD=$(printf '%s' "$JANUS_PG_PASSWORD" | sed \
                -e 's/%/%25/g' \
                -e 's/#/%23/g' \
                -e 's/?/%3F/g' \
                -e 's|/|%2F|g' \
                -e 's/@/%40/g' \
                -e 's/ /%20/g')
              exec /migrate \
                -path {{ .Values.config.migration.path }} \
                -database "postgres://{{ .Values.postgres.user }}:${ESCAPED_PASSWORD}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}?sslmode={{ .Values.postgres.sslMode | default "disable" }}" \
                up
          env:
            - name: JANUS_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.existingSecret }}
                  name: {{ .Values.postgres.existingSecret }}
                  {{- else }}
                  name: {{ include "janus-core.fullname" . }}-migration
                  {{- end }}
                  key: {{ .Values.postgres.secretKey }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: migrations
              mountPath: {{ .Values.config.migration.path }}
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ include "janus-core.fullname" . }}-migrations
