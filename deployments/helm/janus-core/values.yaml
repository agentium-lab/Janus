replicaCount: 1

image:
  repository: ghcr.io/agentium-lab/janus-core
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  # hosts:
  #   - host: janus.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  hosts: []
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

config:
  httpPort: 8080
  grpcPort: 9090
  llm:
    enabled: false
    provider: "openai"
    model: "gpt-4o-mini"
    baseUrl: ""
    maxTokens: 200
    apiKey: ""
    timeoutSeconds: 5
  auth:
    enabled: true
  tls:
    enabled: false
    # TLS certificate configuration
    # When enabled, provide either:
    # - existingSecret: name of a Secret containing tls.crt and tls.key
    # - certFile and keyFile: paths to certificate files (for testing)
    existingSecret: ""
    certFile: ""
    keyFile: ""
    # Name of a Secret containing ca.crt: the CA the in-process grpc-gateway
    # uses to VERIFY the gRPC server's certificate (fixes the gateway
    # identity defect — without it the gateway warns and skips verification).
    # May point at the same Secret as existingSecret when it carries ca.crt.
    gatewayCaSecret: ""
    # grpc-gateway client TLS. serverName defaults to the in-process dial
    # host ("localhost"); set it when the server certificate has no
    # localhost SAN (e.g. a service-DNS certificate).
    gateway:
      serverName: ""
      # Explicit opt-in to skip gateway server-certificate verification
      # when gatewayCaSecret is empty (dev-only; warned at startup).
      # Default false: under tls.enabled with no CA the server REFUSES to
      # start — fail-closed. Conflicts with gatewayCaSecret (startup error).
      insecure: false
      # Name of a Secret containing tls.crt + tls.key that the gateway
      # presents as a CLIENT certificate. Required when clientCaSecret is
      # set, or the server rejects the gateway's own connection.
      clientCertSecret: ""
    # Name of a Secret containing ca.crt: CA the SERVER trusts to verify
    # client certificates (mTLS). When set, BOTH the HTTP and gRPC servers
    # require client certificates — kubelet HTTP probes cannot present one,
    # so such deployments must front Janus with a TLS-terminating proxy and
    # disable the in-chart probes (probes.*.enabled=false).
    clientCaSecret: ""
  heartbeat:
    sweeperInterval: 30s
    ttl: 60s
  migration:
    auto: false
    path: /app/migrations

postgres:
  host: "postgres"
  port: 5432
  user: "janus"
  password: ""
  database: "janus"
  maxConns: 20
  existingSecret: ""
  secretKey: "password"
  # Must match the API's PG sslmode; the migration Job DSN uses the same value.
  sslMode: "disable"

queue:
  driver: "nats"  # "pg" runs without NATS (single-dependency mode)
nats:
  # Use tls:// scheme for transport encryption. Credentials ride inside the
  # URL (nats://user:pass@host) — put that URL in a Secret and point
  # existingSecret at it instead of committing it here.
  url: "nats://nats:4222"
  existingSecret: ""

redis:
  addr: "redis:6379"
  enableTLS: false  # set true when Redis frontends TLS (enable-tls yes)
  password: ""
  db: 0
  existingSecret: ""
  # Key inside the Secret holding the Redis password. The chart-generated
  # Secret stores it under "redis-password"; only override when pointing at
  # an existingSecret that uses a different key.
  secretKey: "redis-password"

artifacts:
  # Disabled by default: result refs use object storage / external URIs.
  # ReadWriteOnce PVC + HPA minReplicas>1 would violate multi-attach limits.
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/artifacts

pdb:
  enabled: true
  minAvailable: 1

extraEnv: []

extraEnvFrom: []

extraVolumes: []

extraVolumeMounts: []

prometheus:
  enabled: true
  port: 8080
  path: /metrics

prometheusRule:
  enabled: false
  additionalLabels: {}
