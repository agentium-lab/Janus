services:
  janus-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      JANUS_PG_HOST: postgres
      JANUS_PG_PORT: "5432"
      JANUS_PG_USER: janus
      JANUS_PG_PASSWORD: janus
      JANUS_PG_DATABASE: janus
      # Dev PG runs without TLS; the default sslmode=require would hard-fail.
      JANUS_PG_SSLMODE: "disable"
      # Default keeps parity with the bundled NATS. Start with
      #   JANUS_QUEUE_DRIVER=pg docker compose up
      # (plus `--profile with-nats` removed) for a PostgreSQL-only stack —
      # see README "Running without NATS".
      JANUS_NATS_URL: "nats://nats:4222"
      JANUS_REDIS_ADDR: "redis:6379"
      JANUS_MIGRATION_AUTO: "true"
      JANUS_MIGRATION_PATH: "/migrations"
      # Auth must stay ON here: the container binds 0.0.0.0 for port publishing,
      # and the server refuses auth-disabled non-loopback binds by design.
      # PostgreSQL-only by default (single dependency). For NATS delivery:
      #   JANUS_QUEUE_DRIVER=nats docker compose --profile with-nats up
      JANUS_QUEUE_DRIVER: ${JANUS_QUEUE_DRIVER:-pg}
      # A documented dev key is seeded by the api-key-seed service below.
      JANUS_AUTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Seeds the documented dev API key AFTER janus-api is healthy (= migrations
  # applied). Credential is public by design — see deployments/dev/seed-dev-key.sql.
  api-key-seed:
    image: postgres:16-alpine
    depends_on:
      janus-api:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: janus
      PGPASSWORD: janus
      PGDATABASE: janus
    volumes:
      - ./deployments/dev/seed-dev-key.sql:/seed-dev-key.sql:ro
    entrypoint: >
      sh -c 'until psql -v ON_ERROR_STOP=1 -q -f /seed-dev-key.sql; do sleep 2; done;
             echo "dev API key seeded for tenant acme"'
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: janus
      POSTGRES_DB: janus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus"]
      interval: 3s
      timeout: 3s
      retries: 10

  nats:
    profiles: ["with-nats"]
    image: nats:2-alpine
    command: -js -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
