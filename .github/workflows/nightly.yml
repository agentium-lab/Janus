              binary = str(pathlib.Path(os.environ.get("JANUS_API_BIN", str(DIST/"bin/janus-api"))).resolve())
              assert pathlib.Path(binary).is_file() and os.access(binary, os.X_OK), "candidate binary missing or not executable"
              proc = subprocess.Popen([binary], env=env, stdout=log_handle, stderr=subprocess.STDOUT, start_new_session=True, cwd=WORKSPACE)
              deadline = time.monotonic()+90
              ready = False
              while time.monotonic() < deadline:
                  if proc.poll() is not None:
                      raise RuntimeError("auth-on candidate exited during boot; see auth-smoke-api.log")
                  try:
                      with urllib.request.urlopen(URL+"/readyz", timeout=2) as response:
                          if response.status == 200:
                              ready = True
                              break
                  except (urllib.error.URLError, TimeoutError):
                      pass
                  time.sleep(0.5)
              if not ready:
                  raise RuntimeError("auth-on candidate readiness deadline exceeded; see auth-smoke-api.log")
              sql = "INSERT INTO tenants(id,name) VALUES ('"+TENANT+"','nightly auth A'), ('"+FOREIGN+"','nightly auth B');\n"
              for raw,scope in [(READ_KEY,"task:read"),(AUDIT_KEY,"audit:read")]:
                  sql += "INSERT INTO api_keys(tenant_id,key_hash,name,prefix,scopes) VALUES ('{}','{}','nightly-auth','{}',ARRAY['{}']);\n".format(TENANT,hashlib.sha256(raw.encode()).hexdigest(),raw[:8],scope)
              for tenant,tid,status in [(TENANT,"auth-completed","completed"),(TENANT,"auth-queued","queued"),(FOREIGN,"auth-completed","completed")]:
                  envelope = {"janus_version":"0.3","task_id":tid,"tenant_id":tenant,"source_agent":"worker",
                              "target":{"type":"mailbox","value":"auth-mb"},"payload":{"type":"json","content":"auth smoke"},
                              "trace":{"trace_id":"nightly-auth-"+tid}}
                  content = json.dumps(envelope).replace("'","''")
                  sql += "INSERT INTO tasks(tenant_id,id,source_agent,target_type,target_value,mailbox_id,status,priority,envelope) VALUES ('{}','{}','worker','mailbox','auth-mb','auth-mb','{}','normal','{}'::jsonb);\n".format(tenant,tid,status,content)
              psql(sql, DB)
          
          def cleanup():
              errors=[]
              if proc is not None and proc.poll() is None:
                  try:
                      if proc.pid <= 1 or os.getpgid(proc.pid) != proc.pid:
                          raise RuntimeError("candidate process group ownership mismatch")
                      os.killpg(proc.pid, signal.SIGTERM)
                      try:
                          proc.wait(timeout=40)
                      except subprocess.TimeoutExpired:
                          os.killpg(proc.pid, signal.SIGKILL)
                          proc.wait(timeout=10)
                          errors.append("candidate exceeded graceful shutdown budget")
                  except ProcessLookupError:
                      proc.wait(timeout=10)
                  except Exception as exc:
                      errors.append("candidate cleanup: " + str(exc))
              if proc is not None and proc.poll() is not None and proc.returncode != 0:
                  errors.append("candidate exited nonzero: " + str(proc.returncode))
              if log_handle is not None:
                  log_handle.close()
              if created:
                  try:
                      psql("DROP DATABASE IF EXISTS " + DB + " WITH (FORCE)")
                  except Exception as exc:
                      errors.append(str(exc))
              if errors:
                  raise RuntimeError("; ".join(errors))
          
          def main():
