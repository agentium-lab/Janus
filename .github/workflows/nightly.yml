  "summarize":
    "name": "Verify evidence completeness"
    "needs":
      - "prepare"
      - "build"
      - "production-gates"
      - "deployment-cells"
      - "dr-failover"
      - "dr-pitr"
      - "sdk-chaos"
      - "chart-install-upgrade"
      - "chart-upgrade-rollback"
      - "critical-regressions"
      - "full-performance"
    "if": "${{ always() }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "steps":
      -
        "name": "Download this attempt evidence"
        "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        "with":
          "pattern": "nightly-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/nightly-reports"
          "merge-multiple": false
      -
        "name": "Fail on missing, skipped, failed or mismatched evidence"
        "if": "${{ always() }}"
        "env":
          "NEEDS_JSON": "${{ toJSON(needs) }}"
          "PLAN_MANIFEST": "${{ needs.prepare.outputs.manifest }}"
          "BUILD_IMAGE_ID": "${{ needs.build.outputs.image_id }}"
        "run": |
          cat > /tmp/summarize-nightly.py <<'JANUS_EMBED_SUMMARIZE_PY'
          import json
          import os
          import pathlib
          import sys
          
          root = pathlib.Path(os.environ.get("REPORTS_DIR", "/tmp/nightly-reports"))
          out = pathlib.Path(os.environ.get("SUMMARY_DIR", "/tmp/nightly-summary"))
          out.mkdir(parents=True, exist_ok=True)
          needs = json.loads(os.environ.get("NEEDS_JSON", "{}"))
          errors = []
          try:
              manifest = json.loads(os.environ["PLAN_MANIFEST"])
          except (KeyError, ValueError):
              manifest = {"candidate_sha": "UNKNOWN", "expected_suites": []}
              errors.append("plan did not publish a valid manifest")
          expected = manifest["expected_suites"]
          for name in ("prepare", "build"):
              if needs.get(name, {}).get("result") != "success":
                  errors.append(name + " did not succeed")
          
          records = {}
          for path in root.glob("**/result.json"):
              try:
                  data = json.loads(path.read_text())
                  suite = data["suite_id"]
                  if suite in records:
                      errors.append("duplicate result: " + suite)
                  records[suite] = data
              except (OSError, ValueError, KeyError) as exc:
                  errors.append("invalid result file: " + str(path) + ": " + str(exc))
          
          image_id = os.environ.get("BUILD_IMAGE_ID", "")
          rows = []
          for suite in expected:
              data = records.get(suite)
              if not data:
                  errors.append("required suite has no artifact/result: " + suite)
                  rows.append((suite, "MISSING", "", ""))
                  continue
              if data.get("candidate_sha") != manifest["candidate_sha"]:
                  errors.append("candidate SHA mismatch: " + suite)
              if not image_id or data.get("candidate_image_id") != image_id:
                  errors.append("candidate image mismatch: " + suite)
              status = data.get("status", "INVALID")
              if status == "WAIVED":
                  if suite != "full-performance" or not manifest.get("performance_exception"):
                      errors.append("undeclared waiver: " + suite)
              elif status != "PASS":
                  errors.append("required suite did not pass: " + suite)
              rows.append((suite, status, data.get("elapsed_seconds", ""), data.get("artifact_name", "")))
          
          allowed_skips = set(manifest.get("optional_jobs", []))
          for name, value in needs.items():
              if name in ("prepare", "build"):
                  continue
              result = value.get("result")
              if result == "skipped" and name in allowed_skips:
                  continue
              if result != "success":
                  errors.append("GitHub job " + name + " result=" + str(result))
          
          extra = sorted(set(records) - set(expected))
          if extra:
              errors.append("unexpected suite results: " + ", ".join(extra))
          passed = not errors
          lines = ["# Janus validation evidence", "", "Candidate: `" + manifest["candidate_sha"] + "`",
                   "Baseline: `" + manifest.get("baseline_sha", "") + "`",
                   "Mode: `" + manifest.get("mode", "unknown") + "`", "",
                   "| Suite | Result | Seconds | Artifact |", "|---|---|---:|---|"]
          for suite, status, elapsed, artifact in rows:
              lines.append("| " + suite + " | " + status + " | " + str(elapsed) + " | " + artifact + " |")
          lines += ["", "Artifacts: " + os.environ.get("GITHUB_SERVER_URL", "https://github.com") + "/" +
                    os.environ.get("GITHUB_REPOSITORY", "") + "/actions/runs/" + os.environ.get("GITHUB_RUN_ID", "") + "#artifacts"]
          if manifest.get("performance_exception"):
              lines += ["", "Performance target gaps are an owner-accepted nonblocking exception. WAIVED is not target attainment."]
          lines += ["", "Result: **" + ("PASS" if passed else "FAIL") + "**"]
          lines += ["- " + error for error in errors]
          summary = "\n".join(lines) + "\n"
          (out / "summary.md").write_text(summary)
          (out / "aggregate.json").write_text(json.dumps({"passed": passed, "errors": errors,
                                                         "manifest": manifest, "results": records}, indent=2) + "\n")
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(summary)
          print(summary)
          sys.exit(0 if passed else 1)
          JANUS_EMBED_SUMMARIZE_PY
          python3 /tmp/summarize-nightly.py
      -
        "name": "Upload nightly-summary-${{ github.run_id }}-${{ github.run_attempt }}"
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "with":
          "name": "nightly-summary-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/nightly-summary"
          "retention-days": 90
          "if-no-files-found": "error"
        "if": "${{ always() }}"
