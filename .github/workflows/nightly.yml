      "JANUS_REDIS_ADDR": "127.0.0.1:6379"
      "PGPASSWORD": "janus"
      "JANUS_API_BIN": "/tmp/janus-candidate/bin/janus-api"
      "JANUS_ALLOW_REQUIRED_SKIP": "0"
      "KEEP_WORK": "1"
      "PG_BINDIR": "/usr/lib/postgresql/16/bin"
      "SUITE_ID": "dr-pitr"
      "CANDIDATE_SHA": "${{ needs.prepare.outputs.sha }}"
      "EVIDENCE_ARTIFACT": "nightly-evidence-dr-pitr-${{ github.run_id }}-${{ github.run_attempt }}"
      "BINARY_MODE": "script-owned-same-sha-rebuild"
      "EXPECTED_STEP_IDS_JSON": "[\"artifact_verify\", \"setup\", \"drill\"]"
    "steps":
      -
        "name": "Record suite start"
        "run": |
          mkdir -p "$EVIDENCE_DIR"
          date +%s > "$EVIDENCE_DIR/suite-started.txt"
      -
        "name": "Checkout frozen candidate"
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "ref": "${{ needs.prepare.outputs.sha }}"
          "fetch-depth": 0
      -
        "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff"
