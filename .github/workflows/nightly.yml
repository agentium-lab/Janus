            docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true
          fi
      -
        "name": "Write machine-readable suite result"
        "id": "result"
        "if": "${{ always() }}"
        "env":
          "STEPS_JSON": "${{ toJSON(steps) }}"
          "JOB_STATUS": "${{ job.status }}"
        "run": |
          set -euo pipefail
          if [[ -f "$JANUS_DIST/tools/finalize.py" && -f "$JANUS_DIST/manifest.json" ]]; then
            python3 "$JANUS_DIST/tools/finalize.py"
          else
            python3 - <<'JANUS_FALLBACK'
          import json, os, pathlib
          p = pathlib.Path(os.environ['EVIDENCE_DIR']); p.mkdir(parents=True, exist_ok=True)
          r = dict(suite_id=os.environ['SUITE_ID'], status='FAIL', candidate_sha=os.environ.get('CANDIDATE_SHA', ''), candidate_image_id='', problems=['candidate runtime unavailable; suite not proven'], artifact_name=os.environ['EVIDENCE_ARTIFACT'])
