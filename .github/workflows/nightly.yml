          #!/usr/bin/env python3
          """Run only the existing critical Go regressions, rejecting absent or skipped cases."""
          import collections, json, os, pathlib, re, signal, subprocess, sys, time
          CASES = [{'id': 'retry-race-loser-connection-return', 'package': './server/internal/retry', 'test': 'TestProcessReadyRetries_RaceLoserReturnsConnection'}, {'id': 'latency-writer-preserves-streaming', 'package': './server/internal/observability', 'test': 'TestRequestLatencyMiddleware_PreservesFlusherAndHijacker'}, {'id': 'a2a-stream-rejects-before-create', 'package': './server/internal/gateway/a2a', 'test': 'TestA2A_V1StreamMessage_NoFlusher_RejectsBeforeCreate'}, {'id': 'a2a-jsonrpc-scopes', 'package': './server/internal/gateway/a2a', 'test': 'TestA2A_JSONRPC_ScopeGuardAnyOf_HandlerStrictPerMethod'}, {'id': 'sse-hostile-id-serialization', 'package': './server/internal/handler', 'test': 'TestConstructSSEData_HostileIDsStayDecodable'}, {'id': 'dlq-two-replay-real-queue', 'package': './server/internal/handler', 'test': 'TestGA05_T2c_RealQueueReplayDeliveryChain_PG'}, {'id': 'grpc-mailbox-owner-identity', 'package': './server/internal/auth', 'test': 'TestCheckGRPCAgentIdentity_CreateMailboxOwner'}, {'id': 'pg-scanner-restores-lost-message', 'package': './server/internal/recovery', 'test': 'TestTaskScanner_RecoveryAfterMessageLoss_RealNATS_PG'}, {'id': 'tasks-stream-rebuild-consumption', 'package': './server/internal/driver/nats', 'test': 'TestB8_TasksStreamLoss_RebuildRestoresConsumption'}, {'id': 'http-cross-tenant-denial', 'package': './server/tests/invariants', 'test': 'TestSecurity_CrossTenantAccessDenied'}, {'id': 'http-bound-identity-surface', 'package': './server/tests/invariants', 'test': 'TestIdentityInvariant_HTTP_AllEntrypoints'}, {'id': 'grpc-identity-method-declaration', 'package': './server/tests/invariants', 'test': 'TestIdentityInvariant_GRPC_EveryMethodDeclared'}, {'id': 'grpc-bound-identity-denial', 'package': './server/tests/invariants', 'test': 'TestIdentityInvariant_GRPC_SpoofRejected'}, {'id': 'grpc-scope-parity', 'package': './server/internal/grpc', 'test': 'TestCrossProtocolScopeParity'}, {'id': 'grpc-denial-surfaces', 'package': './server/internal/grpc', 'test': 'TestCrossProtocolDenialSurfaces'}]
          
          def main():
              evidence = pathlib.Path(os.environ.get("EVIDENCE_DIR", "/tmp/janus-evidence"))
              evidence.mkdir(parents=True, exist_ok=True)
              groups = collections.OrderedDict()
              for case in CASES:
                  groups.setdefault(case["package"], []).append(case)
              results = []
              env = dict(os.environ, CGO_ENABLED="1")
              for package, expected in groups.items():
                  log = evidence / ("critical-" + package.replace("./", "").replace("/", "-") + ".jsonl")
                  pattern = "^(?:" + "|".join(re.escape(x["test"]) for x in expected) + ")$"
                  command = ["go", "test", "-json", "-race", "-count=1", "-timeout=180s", "-run", pattern, package]
                  started = time.monotonic()
                  timed_out = False
                  with log.open("wb") as stream:
                      proc = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT, env=env, start_new_session=True)
                      try:
                          code = proc.wait(timeout=480)
                      except subprocess.TimeoutExpired:
                          timed_out = True
                          os.killpg(proc.pid, signal.SIGTERM)
                          try:
                              code = proc.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              os.killpg(proc.pid, signal.SIGKILL)
                              code = proc.wait()
                  events = []
                  for line in log.read_text(errors="replace").splitlines():
                      try:
                          events.append(json.loads(line))
                      except json.JSONDecodeError:
                          pass
                  for case in expected:
                      name = case["test"]
                      own = [e for e in events if e.get("Test") == name]
                      related = [e for e in events if e.get("Test", "") == name or e.get("Test", "").startswith(name + "/")]
                      ran = any(e.get("Action") == "run" for e in own)
                      terminal = [e["Action"] for e in own if e.get("Action") in ("pass", "fail", "skip")]
                      skipped = sorted({e["Test"] for e in related if e.get("Action") == "skip"})
                      failed = sorted({e["Test"] for e in related if e.get("Action") == "fail"})
                      ok = ran and terminal == ["pass"] and not skipped and not failed and code == 0 and not timed_out
                      reason = ""
                      if timed_out:
                          reason = "package wall-clock timeout"
                      elif not ran:
                          reason = "required named case did not execute (missing, build failure, or zero match)"
                      elif skipped:
                          reason = "required case or subcase skipped: " + ", ".join(skipped)
                      elif failed or terminal != ["pass"] or code != 0:
                          reason = "test/package did not pass"
                      results.append(dict(case, required=True, status="PASS" if ok else "FAIL", executed=ran,
                                          skipped=skipped, failed=failed, reason=reason, command=command,
                                          exit_code=code, elapsed_seconds=round(time.monotonic()-started, 3), log=log.name))
                      print(("PASS " if ok else "FAIL ") + case["id"] + (": " + reason if reason else ""), flush=True)
              summary = {"suite":"critical-regressions", "candidate_sha":os.environ.get("CANDIDATE_SHA", ""),
                         "expected":len(CASES), "passed":sum(r["status"] == "PASS" for r in results),
                         "failed":sum(r["status"] != "PASS" for r in results), "cases":results}
              (evidence / "critical-cases.json").write_text(json.dumps(summary, indent=2) + "\n")
              return 0 if summary["passed"] == len(CASES) and summary["failed"] == 0 else 1
          if __name__ == "__main__":
              sys.exit(main())
