          #!/usr/bin/env python3
          """Real auth-on candidate smoke; SQL is fixture setup, assertions use HTTP/gateway/SSE/WS."""
          import base64, hashlib, json, os, pathlib, signal, socket, subprocess, sys, time, urllib.error, urllib.request
          EVIDENCE = pathlib.Path(os.environ.get("EVIDENCE_DIR", "/tmp/janus-evidence"))
          EVIDENCE.mkdir(parents=True, exist_ok=True)
          RESULTS = []
          WORKSPACE = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", os.getcwd())).resolve()
          DIST = pathlib.Path(os.environ.get("JANUS_DIST", "/tmp/janus-candidate")).resolve()
          DB = "janus_nightly_auth_" + str(os.getpid()) + "_" + str(time.time_ns() % 100000000)
          PORT = int(os.environ.get("AUTH_SMOKE_HTTP_PORT", "18490"))
          GRPC_PORT = int(os.environ.get("AUTH_SMOKE_GRPC_PORT", "19490"))
          URL = "http://127.0.0.1:" + str(PORT)
          TENANT = "nightly-auth-a"
          FOREIGN = "nightly-auth-b"
          READ_KEY = "janus_nightly_read_" + os.urandom(12).hex()
          AUDIT_KEY = "janus_nightly_audit_" + os.urandom(12).hex()
          proc = None
          created = False
          log_handle = None
          
          def psql(sql, database=None):
              cmd = ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-h", os.environ.get("JANUS_PG_HOST", "127.0.0.1"),
                     "-p", os.environ.get("JANUS_PG_PORT", "5432"), "-U", os.environ.get("JANUS_PG_USER", "janus"),
                     "-d", database or os.environ.get("JANUS_PG_DATABASE", "janus_test"), "-c", sql]
              e = dict(os.environ, PGPASSWORD=os.environ.get("JANUS_PG_PASSWORD", "janus"))
              completed = subprocess.run(cmd, env=e, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
              if completed.returncode:
                  raise RuntimeError("fixture SQL failed: " + completed.stderr[-1000:])
          
          def record(case, fn):
              started = time.monotonic()
              try:
                  fn()
                  result = {"id":case, "required":True, "status":"PASS", "elapsed_seconds":round(time.monotonic()-started, 3)}
              except Exception as exc:
                  result = {"id":case, "required":True, "status":"FAIL", "elapsed_seconds":round(time.monotonic()-started, 3),
                            "reason":str(exc)[:1500]}
              RESULTS.append(result)
              print(result["status"] + " " + case + (": " + result.get("reason", "") if result.get("reason") else ""), flush=True)
          
          def request(path, key=READ_KEY, expected=200):
              headers = {"x-api-key":key} if key else {}
              r = urllib.request.Request(URL+path, headers=headers)
              try:
                  resp = urllib.request.urlopen(r, timeout=10)
              except urllib.error.HTTPError as exc:
                  resp = exc
              with resp:
                  body = resp.read(1048576)
                  assert resp.status == expected, "{} returned {}, expected {}: {}".format(path, resp.status, expected, body[:200])
                  return json.loads(body) if body and expected == 200 else body
          
          def get_self(path):
              data = request(path)
              assert data.get("id") == "auth-completed", "authoritative task ID mismatch"
          
          def sse(path, expected_key, expected_task=None, expected_event=None):
              headers = {"x-api-key":READ_KEY, "Accept":"text/event-stream"}
              if path.startswith("/a2a/"):
                  headers["A2A-Version"] = "1.0"
              req = urllib.request.Request(URL+path, headers=headers)
              try:
                  response = urllib.request.urlopen(req, timeout=10)
              except urllib.error.HTTPError as exc:
                  detail = exc.read(1000).decode("utf-8", errors="replace")
                  raise AssertionError("{} returned HTTP {}: {}".format(path, exc.code, detail)) from exc
              with response:
                  assert response.status == 200
                  assert response.headers.get("Content-Type", "").startswith("text/event-stream")
                  event_name = None
                  for _ in range(30):
                      line = response.readline(65537)
                      assert len(line) <= 65536, "unbounded SSE line"
                      if not line:
                          break
                      if line.startswith(b"event:"):
                          event_name = line.split(b":", 1)[1].strip().decode()
                      if line.startswith(b"data:"):
                          data = json.loads(line.split(b":", 1)[1].strip())
                          assert expected_key in data, "SSE frame schema mismatch"
                          if expected_event is not None:
                              assert event_name == expected_event, "SSE event type mismatch"
                              assert data[expected_key] == "completed", "SSE terminal status mismatch"
                          if expected_task is not None:
                              assert data[expected_key].get("id") == expected_task, "SSE task identity mismatch"
                          return
                  raise AssertionError("no usable SSE data frame")
          
          def websocket():
              key = base64.b64encode(os.urandom(16)).decode()
              headers = ("GET /ws HTTP/1.1\r\nHost: 127.0.0.1:{port}\r\nOrigin: http://127.0.0.1:{port}\r\n"
                         "Upgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\n"
                         "Sec-WebSocket-Version: 13\r\nx-api-key: {api}\r\n\r\n").format(port=PORT,key=key,api=READ_KEY)
              with socket.create_connection(("127.0.0.1", PORT), timeout=10) as conn:
                  conn.settimeout(10)
                  conn.sendall(headers.encode())
                  data = b""
                  while b"\r\n\r\n" not in data and len(data) < 16384:
                      part = conn.recv(4096)
                      if not part:
                          break
                      data += part
                  head = data.split(b"\r\n\r\n", 1)[0].decode("latin-1")
                  assert head.split("\r\n",1)[0].startswith("HTTP/1.1 101 "), "WebSocket did not upgrade: " + head[:500]
                  values = {line.split(":",1)[0].lower():line.split(":",1)[1].strip() for line in head.split("\r\n")[1:] if ":" in line}
                  expected = base64.b64encode(hashlib.sha1((key+"258EAFA5-E914-47DA-95CA-C5AB0DC85B11").encode()).digest()).decode()
                  assert values.get("sec-websocket-accept") == expected, "WebSocket accept proof mismatch"
                  conn.sendall(b"\x88\x80" + os.urandom(4))
          
          def setup():
              global proc, created, log_handle
              assert 1024 <= PORT <= 65535 and 1024 <= GRPC_PORT <= 65535 and PORT != GRPC_PORT, "invalid isolated smoke ports"
              # Refuse an occupied port rather than accidentally probing a pre-existing process.
              for port in (PORT, GRPC_PORT):
