# Single-file replacement draft for .github/workflows/nightly.yml.
# Generated against main 155201547db8e8c32e94ade7676cb6daef45c11e.
# Daily 11:17 Asia/Shanghai: functional; Sunday 12:47: isolated full performance.
# Runtime helpers are embedded; no additional repository files are required.
"name": "Nightly Production Gates"
"on":
  "schedule":
    -
      "cron": "17 3 * * *"
    -
      "cron": "47 4 * * 0"
  "workflow_dispatch":
    "inputs":
      "profile":
        "description": "nightly=functional; full=functional+performance; performance=load only"
        "required": true
        "type": "choice"
        "options":
          - "full"
          - "nightly"
          - "performance"
        "default": "full"
      "candidate_ref":
        "description": "Candidate ref; frozen to one SHA before any tests"
        "required": true
        "type": "string"
        "default": "main"
      "baseline_ref":
        "description": "Optional upgrade baseline; blank selects latest distinct stable tag"
        "required": false
        "type": "string"
        "default": ""
"permissions":
  "contents": "read"
"concurrency":
  "group": "janus-nightly-${{ github.event_name == 'schedule' && github.event.schedule || github.run_id }}"
  "cancel-in-progress": "${{ github.event_name == 'schedule' }}"
"defaults":
  "run":
    "shell": "bash"
"env":
  "JANUS_DIST": "/tmp/janus-candidate"
  "EVIDENCE_DIR": "/tmp/janus-evidence"
  "JANUS_API_BIN": "/tmp/janus-candidate/bin/janus-api"
  "JANUS_PG_HOST": "127.0.0.1"
  "JANUS_PG_PORT": "5432"
  "JANUS_PG_USER": "janus"
  "JANUS_PG_PASSWORD": "janus"
  "JANUS_PG_DATABASE": "janus_test"
  "JANUS_PG_DBNAME": "janus_test"
  "JANUS_PG_SSLMODE": "disable"
  "JANUS_PG_DSN": "postgres://janus:janus@127.0.0.1:5432/janus_test?sslmode=disable"
  "PGPASSWORD": "janus"
  "JANUS_NATS_URL": "nats://127.0.0.1:4222"
  "JANUS_REDIS_ADDR": "127.0.0.1:6379"
  "JANUS_URL": "http://127.0.0.1:8080"
  "KEEP_WORK": "1"
  "GOTOOLCHAIN": "local"
"jobs":
  "prepare":
    "name": "Freeze candidate, baseline and dependencies"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 25
    "outputs":
      "sha": "${{ steps.plan.outputs.sha }}"
      "baseline_ref": "${{ steps.plan.outputs.baseline_ref }}"
      "baseline_sha": "${{ steps.plan.outputs.baseline_sha }}"
      "mode": "${{ steps.plan.outputs.mode }}"
      "functional": "${{ steps.plan.outputs.functional }}"
      "performance": "${{ steps.plan.outputs.performance }}"
      "go_version": "${{ steps.plan.outputs.go_version }}"
      "manifest": "${{ steps.plan.outputs.manifest }}"
    "steps":
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "ref": "${{ inputs.candidate_ref || github.sha }}"
          "fetch-depth": 0
      -
        "name": "Resolve immutable run plan"
        "id": "plan"
        "env":
          "REQUESTED_PROFILE": "${{ inputs.profile }}"
          "REQUESTED_BASELINE": "${{ inputs.baseline_ref }}"
          "CRITICAL_CASE_IDS_JSON": "[\"retry-race-loser-connection-return\",\"latency-writer-preserves-streaming\",\"a2a-stream-rejects-before-create\",\"a2a-jsonrpc-scopes\",\"sse-hostile-id-serialization\",\"dlq-two-replay-real-queue\",\"grpc-mailbox-owner-identity\",\"pg-scanner-restores-lost-message\",\"tasks-stream-rebuild-consumption\",\"http-cross-tenant-denial\",\"http-bound-identity-surface\",\"grpc-identity-method-declaration\",\"grpc-bound-identity-denial\",\"grpc-scope-parity\",\"grpc-denial-surfaces\"]"
          "AUTH_CASE_IDS_JSON": "[\"auth.setup\",\"auth.rest-read\",\"auth.gateway-native-read\",\"auth.rest-sse\",\"auth.a2a-sse\",\"auth.websocket-upgrade\",\"auth.rest-cross-tenant-denied\",\"auth.gateway-cross-tenant-denied\",\"auth.missing-key-denied\",\"auth.gateway-missing-scope-denied\",\"auth.cleanup\"]"
        "run": |
          cat > /tmp/janus-plan.py <<'JANUS_EMBED_PLAN_PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import time
          
          out = pathlib.Path('/tmp/nightly-plan')
          out.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def resolve(ref):
              sha = git('rev-parse', '--verify', '--end-of-options', ref + '^{commit}')
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise RuntimeError('invalid commit: ' + ref)
              return sha
          sha = resolve('HEAD')
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          mode = os.environ.get('REQUESTED_PROFILE') or ('performance' if event.get('schedule') == '47 4 * * 0' else 'nightly')
          if mode not in ('nightly', 'full', 'performance'):
              raise RuntimeError('unsupported profile')
          functional = mode != 'performance'
          performance = mode != 'nightly'
          baseline_ref = os.environ.get('REQUESTED_BASELINE', '').strip()
          if not baseline_ref and functional:
              tags = [tag for tag in git('tag', '--list').splitlines() if re.fullmatch(r'v\d+\.\d+\.\d+', tag)]
              tags.sort(key=lambda s: tuple(map(int, s[1:].split('.'))), reverse=True)
              baseline_ref = next((tag for tag in tags if resolve(tag) != sha), '')
          baseline_sha = resolve(baseline_ref) if baseline_ref else ''
          if functional and (not baseline_sha or baseline_sha == sha):
              raise RuntimeError('cross-version verification requires a different, resolvable baseline commit')
          go_version = re.search(r'^go\s+(\S+)', pathlib.Path('go.work').read_text(), re.M)[1]
          logical_images = ['postgres:16-alpine', 'nats:2-alpine', 'redis:7-alpine',
                            'migrate/migrate:v4.19.1', 'golang:' + go_version + '-alpine', 'alpine:3.21']
          
          def image_ref(logical):
              official = '/' not in logical
              sources = ['docker.io/' + ('library/' if official else '') + logical]
              if official:
                  sources.append('public.ecr.aws/docker/library/' + logical)
              for source in sources:
                  for attempt in range(3):
                      try:
                          raw = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', '--raw', source], text=True, timeout=120)
                          obj = json.loads(raw)
                          if 'manifests' in obj:
                              candidates = [m['digest'] for m in obj['manifests'] if m.get('platform', {}).get('os') == 'linux' and m.get('platform', {}).get('architecture') == 'amd64']
                              if len(candidates) != 1:
                                  raise RuntimeError('no unique linux/amd64 manifest')
                              digest = candidates[0]
                          else:
                              if obj.get('mediaType') not in ('application/vnd.oci.image.manifest.v1+json', 'application/vnd.docker.distribution.manifest.v2+json'):
                                  raise RuntimeError('unrecognized image manifest')
                              info = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', source], text=True, timeout=120)
                              digest = re.search(r'^Digest:\s+(sha256:[0-9a-f]{64})\s*$', info, re.M)[1]
                          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                              raise RuntimeError('invalid image digest')
                          return source + '@' + digest
                      except (subprocess.SubprocessError, ValueError, RuntimeError, TypeError) as exc:
                          print('image resolution retry:', source, str(exc), flush=True)
                          time.sleep((attempt + 1) * 2)
              raise RuntimeError('unable to resolve immutable dependency: ' + logical)
          images = {logical: image_ref(logical) for logical in logical_images}
          functional_jobs = ['production-gates', 'deployment-cells', 'dr-failover', 'dr-pitr', 'sdk-chaos', 'critical-regressions', 'chart-install-upgrade', 'chart-upgrade-rollback']
          suites = ['production-gates', 'deployment-cells', 'dr-failover', 'dr-pitr', 'sdk-chaos-go', 'sdk-chaos-py', 'sdk-chaos-ts', 'critical-regressions', 'chart-install-upgrade', 'chart-upgrade-rollback'] if functional else []
          if performance:
              suites.append('full-performance')
          case_ids = json.loads(os.environ['CRITICAL_CASE_IDS_JSON'])
          auth_ids = json.loads(os.environ['AUTH_CASE_IDS_JSON'])
          manifest = dict(schema_version=1, candidate_sha=sha, baseline_ref=baseline_ref, baseline_sha=baseline_sha,
                          mode=mode, go_version=go_version, images=images, expected_suites=suites,
                          optional_jobs=(functional_jobs if not functional else []) + ([] if performance else ['full-performance']),
                          critical_case_ids=case_ids, auth_case_ids=auth_ids, performance_exception=True,
                          run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key, value in dict(sha=sha, baseline_ref=baseline_ref, baseline_sha=baseline_sha, mode=mode,
                                     functional=str(functional).lower(), performance=str(performance).lower(),
                                     go_version=go_version, manifest=json.dumps(manifest, separators=(',', ':'))).items():
                  f.write(key + '=' + value + '\n')
          print(json.dumps(manifest, indent=2))
          JANUS_EMBED_PLAN_PY
          python3 /tmp/janus-plan.py
      -
        "name": "Upload janus-plan-${{ github.run_id }}-${{ github.run_attempt }}"
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "with":
          "name": "janus-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/nightly-plan"
          "retention-days": 90
          "if-no-files-found": "error"
        "if": "${{ always() }}"
  "build":
    "needs":
      - "prepare"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 35
    "outputs":
      "image_id": "${{ steps.candidate.outputs.image_id }}"
    "steps":
      -
        "name": "Checkout frozen candidate"
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "ref": "${{ needs.prepare.outputs.sha }}"
          "fetch-depth": 0
      -
        "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        "with":
          "name": "janus-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/nightly-plan"
      -
        "name": "Build candidate image once and extract its runtime"
        "id": "candidate"
        "run": |
          set -euo pipefail
          mkdir -p "$JANUS_DIST"/{bin,tools,image}
          cp /tmp/nightly-plan/manifest.json "$JANUS_DIST/manifest.json"
          python3 - <<'JANUS_DOCKERFILE'
          import json, os, pathlib
          m = json.loads(pathlib.Path('/tmp/nightly-plan/manifest.json').read_text())
          s = pathlib.Path('Dockerfile').read_text()
          s = s.replace('FROM golang:1.25-alpine AS builder', 'FROM ' + m['images']['golang:' + m['go_version'] + '-alpine'] + ' AS builder')
          s = s.replace('FROM alpine:3.21', 'FROM ' + m['images']['alpine:3.21'])
          s = s.replace('ENV GOPROXY=https://goproxy.cn,direct', 'ENV GOPROXY=https://proxy.golang.org,direct')
          if s == pathlib.Path('Dockerfile').read_text() or 'FROM golang:' in s or 'FROM alpine:' in s:
              raise SystemExit('Dockerfile contract changed; explicit review required')
          pathlib.Path('/tmp/Dockerfile.nightly').write_text(s)
          JANUS_DOCKERFILE
          docker build --provenance=false --sbom=false --platform linux/amd64 -f /tmp/Dockerfile.nightly -t janus-core:candidate .
          id="$(docker create janus-core:candidate)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          docker cp "$id:/usr/local/bin/janus-api" "$JANUS_DIST/bin/janus-api"
          docker cp "$id:/usr/local/bin/janus-healthcheck" "$JANUS_DIST/bin/janus-healthcheck"
          docker rm "$id"
          trap - EXIT
          docker save janus-core:candidate -o "$JANUS_DIST/image/candidate.tar"
          docker image inspect janus-core:candidate > "$JANUS_DIST/image-inspect.json"
          cp /tmp/Dockerfile.nightly "$JANUS_DIST/Dockerfile.nightly"
          cat > "$JANUS_DIST/tools/ci.sh" <<'JANUS_EMBED_CI_SH'
          #!/usr/bin/env bash
          # Shared runner tooling. No credentials or entire PG data directories are archived.
          set -Eeuo pipefail
          JANUS_DIST="${JANUS_DIST:-/tmp/janus-candidate}"
          EVIDENCE_DIR="${EVIDENCE_DIR:-/tmp/janus-evidence}"
          mkdir -p "$EVIDENCE_DIR"
          
          ci_wait() {
            local label="$1" seconds="$2"; shift 2
            local end=$((SECONDS + seconds))
            until "$@"; do
              if (( SECONDS >= end )); then
                echo "::error::preflight timed out: $label (${seconds}s)"
                docker ps -a || true
                sudo ss -ltnp || true
                return 1
              fi
              sleep 2
            done
          }
          
          ci_stop_system_services() {
            # Ubuntu packages may auto-start system instances during postinst.
            # These jobs own their fresh runner, not a shared/production host.
            sudo systemctl stop postgresql.service redis-server.service 2>/dev/null || true
            sudo service postgresql stop 2>/dev/null || true
            sudo service redis-server stop 2>/dev/null || true
            if command -v pg_lsclusters >/dev/null; then
              while read -r version cluster _; do
                sudo pg_ctlcluster "$version" "$cluster" stop 2>/dev/null || true
              done < <(pg_lsclusters --no-header)
            fi
          }
          
          install_tools() {
            local mode="${1:-basic}"
            sudo apt-get -o Acquire::Retries=3 update -qq
            local packages=(postgresql-client-16 redis-tools redis-server python3-venv jq)
            if [[ "$mode" == dr ]]; then packages+=(postgresql-16); fi
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y -qq "${packages[@]}"
            ci_stop_system_services
            if ! command -v helm >/dev/null || [[ "$(helm version --short 2>/dev/null)" != v3.16.4+* ]]; then
              local dir
              dir="$(mktemp -d)"
              curl --fail --show-error --location --retry 3 --max-time 120 \
                https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz -o "$dir/helm.tar.gz"
              echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  $dir/helm.tar.gz" | sha256sum -c -
              tar -xzf "$dir/helm.tar.gz" -C "$dir"
              sudo install -m 0755 "$dir/linux-amd64/helm" /usr/local/bin/helm
              rm -rf "$dir"
            fi
            if [[ "$mode" == dr ]]; then
              export PG_BINDIR=/usr/lib/postgresql/16/bin
              export PG_BIN="$PG_BINDIR"
              export PATH="$PG_BINDIR:$PATH"
              if [[ -n "${GITHUB_ENV:-}" ]]; then
                echo "PG_BINDIR=$PG_BINDIR" >> "$GITHUB_ENV"
                echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
                echo "$PG_BINDIR" >> "$GITHUB_PATH"
              fi
              "$PG_BINDIR/initdb" --version
            fi
            {
              go version
              python3 --version
              docker version
              if command -v node >/dev/null; then node --version; fi
              if command -v npm >/dev/null; then npm --version; fi
              if command -v kind >/dev/null; then kind version; fi
              psql --version
              redis-server --version
              helm version --short
              uname -a
              lscpu
              free -m
              df -h /tmp
            } > "$EVIDENCE_DIR/runner-versions.txt" 2>&1
          }
          
          resolved_image() {
            python3 - "$JANUS_DIST/manifest.json" "$1" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          print(manifest["images"][sys.argv[2]])
          PY
          }
          
          pull_image() {
            local logical="$1" ref attempt
            ref="$(resolved_image "$logical")"
            for attempt in 1 2 3; do
              if timeout 180s docker pull --platform linux/amd64 "$ref"; then
                docker tag "$ref" "$logical"
                docker image inspect "$logical" >> "$EVIDENCE_DIR/dependency-images.jsonl"
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "::error::dependency pull failed: $logical (resolved ref recorded in manifest)"
            return 1
          }
          
          start_dependencies() {
            local port
            ci_stop_system_services
            for port in 5432 4222 6379 8222; do
              if python3 - "$port" <<'PY'
          import socket, sys
          s = socket.socket()
          try:
              s.bind(("0.0.0.0", int(sys.argv[1])))
          finally:
              s.close()
          PY
              then :; else
                echo "::error::runner port $port is already occupied"
                sudo ss -ltnp || true
                return 1
              fi
            done
            pull_image postgres:16-alpine
            pull_image nats:2-alpine
            pull_image redis:7-alpine
            docker run -d --name pg -e POSTGRES_USER=janus -e POSTGRES_PASSWORD=janus \
              -e POSTGRES_DB=janus_test -p 5432:5432 postgres:16-alpine
            docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
            docker run -d --name redis -p 6379:6379 redis:7-alpine
            ci_wait postgres 90 docker exec pg pg_isready -h 127.0.0.1 -U janus -d janus_test
            ci_wait nats 60 curl -fsS --max-time 2 http://127.0.0.1:8222/healthz
            ci_wait redis 60 bash -c '[[ "$(docker exec redis redis-cli ping)" == PONG ]]'
            # Probe using the SAME password/env that all Go PG helpers inherit.
            PGPASSWORD=janus psql -h 127.0.0.1 -p 5432 -U janus -d janus_test -v ON_ERROR_STOP=1 -c 'SELECT 1'
          }
          
          kind_import_deps() {
            local cluster="$1" node logical ref attempt ok
            node="$(kind get nodes --name "$cluster" | head -1)"
            for logical in postgres:16-alpine nats:2-alpine redis:7-alpine migrate/migrate:v4.19.1; do
              ref="$(resolved_image "$logical")"
              ok=0
              for attempt in 1 2 3; do
                if timeout 180s docker exec "$node" ctr -n k8s.io images pull --platform linux/amd64 "$ref"; then
                  ok=1; break
                fi
                sleep $((attempt * 3))
              done
              [[ "$ok" == 1 ]] || { echo "::error::kind pull failed: $logical"; return 1; }
              # Existing manifests use these tags; tag them to the resolved immutable object.
              local target="docker.io/$logical"
              if [[ "$logical" != */* ]]; then target="docker.io/library/$logical"; fi
              docker exec "$node" ctr -n k8s.io images tag --force "$ref" "$target"
            done
          }
          
          collect_evidence() {
            mkdir -p "$EVIDENCE_DIR/logs"
            docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true
            sudo ss -ltnp > "$EVIDENCE_DIR/ports.txt" 2>&1 || true
            local container
            for container in pg nats redis; do
              if docker inspect "$container" >/dev/null 2>&1; then
                docker logs --timestamps "$container" > "$EVIDENCE_DIR/logs/docker-$container.log" 2>&1 || true
              fi
            done
            python3 - "$EVIDENCE_DIR" <<'PY'
          import glob, pathlib, shutil, sys
          dest = pathlib.Path(sys.argv[1]) / "logs"
          dest.mkdir(parents=True, exist_ok=True)
          patterns = ["/tmp/janus-api*.log", "/tmp/load-baseline.log", "/tmp/ga09-*.txt",
                      "/tmp/ga09-*.log", "/tmp/ga09-*.json", "/tmp/ga09-*.jsonl",
                      "/tmp/helm-upgrade.log", "/tmp/port-forward.log", "/tmp/ga07-fourcell.*/*",
                      "/tmp/ga10-failover.*/*", "/tmp/janus-ga10-pitr.*/*", "/tmp/sdk-chaos.*/*"]
          for pattern in patterns:
              for name in glob.glob(pattern):
                  path = pathlib.Path(name)
                  if not path.is_file() or path.suffix not in {".log", ".json", ".jsonl", ".txt"}:
                      continue
                  # No PGDATA, backup archives, private keys, environment dump, or source trees.
                  try:
                      shutil.copy2(path, dest / (path.parent.name + "--" + path.name))
                  except OSError as exc:
                      print("evidence-copy:", path.name, str(exc), file=sys.stderr)
          PY
          }
          JANUS_EMBED_CI_SH
          cat > "$JANUS_DIST/tools/finalize.py" <<'JANUS_EMBED_FINALIZE_PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          
          out = pathlib.Path(os.environ.get("EVIDENCE_DIR", "/tmp/janus-evidence"))
          out.mkdir(parents=True, exist_ok=True)
          dist = pathlib.Path(os.environ.get("JANUS_DIST", "/tmp/janus-candidate"))
          manifest = json.loads((dist / "manifest.json").read_text())
          steps = json.loads(os.environ.get("STEPS_JSON", "{}"))
          required = json.loads(os.environ.get("EXPECTED_STEP_IDS_JSON", "[]"))
          case_id = os.environ["SUITE_ID"]
          problems = []
          for name in required:
              if steps.get(name, {}).get("outcome") != "success":
                  problems.append("required step did not succeed: " + name)
          
          cases = []
          for name in ("critical-cases.json", "auth-smoke-cases.json", "performance-report.json"):
              p = out / name
              if p.exists():
                  data = json.loads(p.read_text())
                  cases.extend(data.get("cases", []))
          
          if case_id == "critical-regressions":
              expected = manifest["critical_case_ids"] + manifest["auth_case_ids"]
              actual = [c.get("id") for c in cases]
              if sorted(actual) != sorted(expected):
                  problems.append("named critical/auth case set is missing, duplicated, or changed")
              for case in cases:
                  if case.get("status") != "PASS":
                      problems.append("critical/auth assertion did not pass: " + str(case.get("id")))
          
          if case_id.startswith("sdk-chaos-"):
              lang = case_id.removeprefix("sdk-chaos-")
              log = out / ("sdk-chaos-" + lang + ".log")
              text = log.read_text(errors="replace") if log.exists() else ""
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              expected_faults = ["eof", "network-cut", "lease-lost", "ack-failure", "90s", "stop"]
              complete = bool(re.search(r"^SDK_CHAOS_PASS=1\s*$", text, re.M))
              complete &= bool(re.search(r"SDK_CHAOS_METRICS langs=" + re.escape(lang) + r" cases=6(?:\s|$)", text))
              counts = re.search(r"cases: PASS=(\d+) FAIL=(\d+)", text)
              complete &= bool(counts and int(counts[1]) >= 6 and int(counts[2]) == 0)
              for fault in expected_faults:
                  ran = bool(re.search(re.escape(lang + " CASE " + fault) + r":", text))
                  ok = bool(complete and ran)
                  cases.append({"id": "sdk." + lang + "." + fault,
                                "status": "PASS" if ok else "FAIL", "executed": ran,
                                "reason": "all script assertions passed" if ok else "missing case or nonpassing script summary"})
                  if not ok:
                      problems.append("SDK fault not proven: " + fault)
          
          if case_id == "full-performance":
              if len(cases) != 1 or cases[0].get("id") != "performance.sustained":
                  problems.append("exact sustained-performance report is missing or duplicated")
              elif cases[0].get("status") not in ("PASS", "WAIVED"):
                  problems.append("sustained performance has functional/setup/data failure")
              elif cases[0].get("status") == "WAIVED" and not manifest.get("performance_exception"):
                  problems.append("performance waiver was not declared in run plan")
          
          waived = [c for c in cases if c.get("status") == "WAIVED"]
          if waived and case_id != "full-performance":
              problems.append("waiver outside the declared performance suite")
          
          started_file = out / "suite-started.txt"
          try:
              elapsed = round(time.time() - float(started_file.read_text()), 3)
          except (ValueError, OSError):
