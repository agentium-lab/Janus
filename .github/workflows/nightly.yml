      "JANUS_PG_SSLMODE": "disable"
      "JANUS_PG_DSN": "postgres://janus:janus@localhost:5432/janus_test?sslmode=disable"
      "JANUS_NATS_URL": "nats://localhost:4222"
      "JANUS_REDIS_ADDR": "127.0.0.1:6379"
      "PGPASSWORD": "janus"
      "JANUS_API_BIN": "/tmp/janus-candidate/bin/janus-api"
      "JANUS_ALLOW_REQUIRED_SKIP": "0"
      "JANUS_URL": "http://localhost:8080"
      "SUITE_ID": "production-gates"
      "CANDIDATE_SHA": "${{ needs.prepare.outputs.sha }}"
      "EVIDENCE_ARTIFACT": "nightly-evidence-production-gates-${{ github.run_id }}-${{ github.run_attempt }}"
      "BINARY_MODE": "shared-candidate-plus-script-owned-mixed-version-build"
      "EXPECTED_STEP_IDS_JSON": "[\"artifact_verify\", \"setup\", \"boot_api\", \"dependency_smoke\", \"seven_agents\", \"replica_convergence\", \"acceptance\", \"mixed_version\", \"ops_chaos\", \"release_ops\", \"smoke_load\"]"
    "steps":
      -
        "name": "Record suite start"
        "run": |
          mkdir -p "$EVIDENCE_DIR"
          date +%s > "$EVIDENCE_DIR/suite-started.txt"
      -
        "name": "Checkout frozen candidate"
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "ref": "${{ needs.prepare.outputs.sha }}"
          "fetch-depth": 0
      -
        "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff"
        "with":
          "go-version-file": "go.work"
          "cache-dependency-path": |-
            go.work.sum
            core/go.sum
            proto/go.sum
            server/go.sum
            cli/go.sum
            sdk/go/go.sum
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "with":
          "node-version": "22"
      -
        "name": "Download shared candidate runtime"
        "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        "with":
          "name": "janus-runtime-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/janus-candidate"
      -
        "name": "Verify candidate runtime"
        "id": "artifact_verify"
        "run": |
          set -euo pipefail
          cd "$JANUS_DIST"
          sha256sum -c SHA256SUMS
          chmod +x bin/* tools/ci.sh
      -
        "id": "setup"
        "name": "Prepare isolated runtime dependencies"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          source /tmp/janus-candidate/tools/ci.sh
          install_tools basic
          start_dependencies
          python3 -m venv /tmp/janus-runtime-python
          printf '%s\n' /tmp/janus-runtime-python/bin >> "$GITHUB_PATH"
          } 2>&1 | tee "$EVIDENCE_DIR/setup.log"
      -
        "id": "boot_api"
        "name": "Migrate + start Janus API (two replicas)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          JANUS_QUEUE_DRIVER=nats \
            JANUS_PG_HOST=localhost JANUS_PG_USER=janus JANUS_PG_PASSWORD=janus \
            JANUS_PG_DATABASE=janus_test JANUS_PG_SSLMODE=disable \
            JANUS_NATS_URL=nats://localhost:4222 \
            JANUS_REDIS_ADDR=127.0.0.1:6379 \
            JANUS_MIGRATION_AUTO=true JANUS_MIGRATION_PATH=migrations \
            JANUS_AUTH_ENABLED=false \
            JANUS_HTTP_HOST=localhost JANUS_HTTP_PORT=8080 \
            "$JANUS_API_BIN" > /tmp/janus-api.log 2>&1 &
          echo $! > /tmp/janus-api.pid
          for i in $(seq 1 60); do
            curl -sf "$JANUS_URL/readyz" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf "$JANUS_URL/readyz"
          # Replica B starts only AFTER A is ready: on a fresh database A is
          # still running migrations while B boots, and B's bootstrap queries
          # the tenants table before it exists -> B fatals instantly and the
          # convergence gate finds port 8081 dead.
          JANUS_QUEUE_DRIVER=nats \
            JANUS_PG_HOST=localhost JANUS_PG_USER=janus JANUS_PG_PASSWORD=janus \
            JANUS_PG_DATABASE=janus_test JANUS_PG_SSLMODE=disable \
            JANUS_NATS_URL=nats://localhost:4222 \
            JANUS_REDIS_ADDR=127.0.0.1:6379 \
            JANUS_MIGRATION_AUTO=false \
            JANUS_AUTH_ENABLED=false \
            JANUS_HTTP_HOST=localhost JANUS_HTTP_PORT=8081 \
            JANUS_GRPC_PORT=9091 \
            "$JANUS_API_BIN" > /tmp/janus-api-b.log 2>&1 &
          echo $! > /tmp/janus-api-b.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8081/readyz
          } 2>&1 | tee "$EVIDENCE_DIR/boot_api.log"
      -
        "id": "dependency_smoke"
        "name": "Dependency smoke (API/PG/NATS/Redis + metrics)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          JANUS_URL=$JANUS_URL bash scripts/smoke_api_dependencies.sh
          } 2>&1 | tee "$EVIDENCE_DIR/dependency_smoke.log"
      -
        "id": "seven_agents"
        "name": "Seven-agent scenario (lifecycle + fanout + idempotency)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          JANUS_URL=$JANUS_URL bash scripts/smoke_7_agents.sh
          } 2>&1 | tee "$EVIDENCE_DIR/seven_agents.log"
      -
        "id": "replica_convergence"
        "name": "Two-replica convergence (advisory locks + config version)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          JANUS_URL_A=http://localhost:8080 JANUS_URL_B=http://localhost:8081 \
          JANUS_PG_HOST=localhost JANUS_PG_USER=janus PGPASSWORD=janus JANUS_PG_DBNAME=janus_test \
          bash scripts/smoke_two_replica_convergence.sh
          } 2>&1 | tee "$EVIDENCE_DIR/replica_convergence.log"
      -
        "id": "acceptance"
        "name": "T01-T15 and A1/A2 acceptance matrix"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          # The matrix executes the Python and TS SDK test suites, not just
          # type checks — their runner deps must be present.
          (cd sdk/python && python3 -m pip install --quiet -e '.[dev]')
          (cd sdk/typescript && npm ci --silent)
          bash scripts/acceptance_matrix.sh
          } 2>&1 | tee "$EVIDENCE_DIR/acceptance.log"
      -
        "id": "mixed_version"
        "name": "Mixed-version lock contention (v1.9.0 + HEAD)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          python3 -m pip install --quiet nats-py
          JANUS_PG_HOST=localhost JANUS_PG_USER=janus JANUS_PG_PASSWORD=janus \
          bash scripts/smoke_mixed_version_locks.sh
          } 2>&1 | tee "$EVIDENCE_DIR/mixed_version.log"
        "env":
          "MIX_KEEP_LOGS": "1"
      -
        "id": "ops_chaos"
        "name": "Ops chaos (dependency restarts + state persistence)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          JANUS_URL=$JANUS_URL bash scripts/smoke_ops_chaos.sh
          } 2>&1 | tee "$EVIDENCE_DIR/ops_chaos.log"
        "env":
          "JANUS_PG_DBNAME": "janus_test"
          "JANUS_REDIS_RESTART_CMD": "docker restart redis"
          "JANUS_NATS_STOP_CMD": "docker stop nats"
          "JANUS_NATS_RESTART_CMD": "docker start nats"
          "JANUS_PG_RESTART_CMD": "docker restart pg && sleep 3"
      -
        "id": "release_ops"
        "name": "Release ops (helm lint + migration rollback drill)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          bash scripts/smoke_release_ops.sh
          } 2>&1 | tee "$EVIDENCE_DIR/release_ops.log"
        "env":
          "JANUS_PG_DBNAME": "janus_test"
      -
        "id": "smoke_load"
        "name": "Load baseline (1000 agents / 1000 tasks, p95 gate)"
        "run": |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
          set -o pipefail
          NUM_AGENTS=1000 NUM_MAILBOXES=1000 NUM_TASKS=1000 bash scripts/load_baseline.sh | tee /tmp/load-baseline.log
          echo "## Load baseline trend" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/load-baseline.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee "$EVIDENCE_DIR/smoke_load.log"
        "env":
          "LOAD_BASELINE_P95_MS": "1000"
      -
        "name": "Collect logs before runner cleanup"
        "id": "collect"
        "if": "${{ always() }}"
        "run": |
          set -uo pipefail
          if [[ -f "$JANUS_DIST/tools/ci.sh" ]]; then
            source "$JANUS_DIST/tools/ci.sh"
            collect_evidence
          else
            mkdir -p "$EVIDENCE_DIR"
            docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true
          fi
      -
        "id": "stop_api"
        "name": "Stop Janus API replicas"
        "if": "always()"
        "run": |
          for file in /tmp/janus-api.pid /tmp/janus-api-b.pid; do
            if [ -s "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
      -
        "name": "Write machine-readable suite result"
        "id": "result"
        "if": "${{ always() }}"
        "env":
          "STEPS_JSON": "${{ toJSON(steps) }}"
          "JOB_STATUS": "${{ job.status }}"
        "run": |
          set -euo pipefail
          if [[ -f "$JANUS_DIST/tools/finalize.py" && -f "$JANUS_DIST/manifest.json" ]]; then
            python3 "$JANUS_DIST/tools/finalize.py"
          else
            python3 - <<'JANUS_FALLBACK'
          import json, os, pathlib
          p = pathlib.Path(os.environ['EVIDENCE_DIR']); p.mkdir(parents=True, exist_ok=True)
          r = dict(suite_id=os.environ['SUITE_ID'], status='FAIL', candidate_sha=os.environ.get('CANDIDATE_SHA', ''), candidate_image_id='', problems=['candidate runtime unavailable; suite not proven'], artifact_name=os.environ['EVIDENCE_ARTIFACT'])
          (p / 'result.json').write_text(json.dumps(r, indent=2) + '\n')
          raise SystemExit(1)
          JANUS_FALLBACK
          fi
      -
        "name": "Upload ${{ env.EVIDENCE_ARTIFACT }}"
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "with":
          "name": "${{ env.EVIDENCE_ARTIFACT }}"
          "path": "/tmp/janus-evidence"
          "retention-days": 90
          "if-no-files-found": "error"
        "if": "${{ always() }}"
