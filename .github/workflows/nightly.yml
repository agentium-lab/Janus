                           "expected":expected,"executed":len(RESULTS),"passed":sum(r["status"]=="PASS" for r in RESULTS),
                           "failed":sum(r["status"]!="PASS" for r in RESULTS),"cases":RESULTS,
                           "scope":"real candidate main auth-on PG mode: REST/A2A SSE, WebSocket upgrade, HTTP/gRPC gateway reads and denial; native identity/scope variants separately covered by named Go cases"}
                  (EVIDENCE/"auth-smoke-cases.json").write_text(json.dumps(payload,indent=2)+"\n")
              return 0 if setup_ok and len(RESULTS)==11 and all(r["status"]=="PASS" for r in RESULTS) else 1
          if __name__ == "__main__":
              sys.exit(main())
