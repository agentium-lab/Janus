              psql("CREATE DATABASE " + DB)
              created = True
              env = dict(os.environ, JANUS_QUEUE_DRIVER="pg", JANUS_AUTH_ENABLED="true", JANUS_PG_DATABASE=DB,
                         JANUS_MIGRATION_AUTO="true", JANUS_MIGRATION_PATH=str(migrations),
                         JANUS_HTTP_HOST="127.0.0.1", JANUS_HTTP_PORT=str(PORT), JANUS_GRPC_PORT=str(GRPC_PORT),
                         JANUS_TRACING_ENABLED="false", JANUS_LLM_ENABLED="false", JANUS_TLS_ENABLED="false",
                         JANUS_CONFIG_FILE=os.devnull)
