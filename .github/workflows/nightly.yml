                      record("auth.gateway-cross-tenant-denied", lambda: request("/grpc/v1/tenants/"+FOREIGN+"/tasks/auth-completed", expected=403))
                      record("auth.missing-key-denied", lambda: request("/v1/tenants/"+TENANT+"/tasks/auth-completed", key=None, expected=401))
                      record("auth.gateway-missing-scope-denied", lambda: request("/grpc/v1/tenants/"+TENANT+"/tasks/auth-completed", key=AUDIT_KEY, expected=403))
