name: Nightly Production Gates

# P2-3: chaos / load / release-ops gates run on a schedule so main carries
# continuous evidence instead of relying on manual runs. Core gates
# (build/test/coverage/staticcheck/reliability/contract) stay enforced on
# every push in ci.yml; this workflow covers the gates that need a
# long-running full stack.
on:
  schedule:
    - cron: "17 3 * * *" # daily, off-peak UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-production-gates
  cancel-in-progress: false

jobs:
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JANUS_PG_HOST: localhost
      JANUS_PG_PORT: "5432"
      JANUS_PG_USER: janus
      JANUS_PG_PASSWORD: janus
      JANUS_PG_DATABASE: janus_test
      JANUS_PG_SSLMODE: disable
      JANUS_PG_DSN: postgres://janus:janus@localhost:5432/janus_test?sslmode=disable
      JANUS_NATS_URL: nats://localhost:4222
      JANUS_REDIS_ADDR: 127.0.0.1:6379
      JANUS_URL: http://localhost:8080
      # psql probes in the smoke scripts authenticate over TCP with this.
      PGPASSWORD: janus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The mixed-version gate builds OLD binaries from release tags.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Install tooling (helm, psql, redis-cli)
        run: |
          # Pinned download with checksum verification (no curl | bash).
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools

      - name: Start dependency containers
        run: |
          set -euo pipefail
          pull() {
            for src in "docker.io/$1" "public.ecr.aws/docker/library/$1"; do
              for attempt in 1 2 3; do
                docker pull "$src" && { docker tag "$src" "$1"; return 0; }
                sleep $((attempt * 10))
              done
            done
            echo "::error::unable to pull $1"; return 1
          }
          pull postgres:16-alpine
          pull nats:2-alpine
          pull redis:7-alpine
          docker run -d --name pg -e POSTGRES_USER=janus -e POSTGRES_PASSWORD=janus \
            -e POSTGRES_DB=janus_test -p 5432:5432 postgres:16-alpine
          # -m 8222 enables the monitoring endpoint the smoke/chaos scripts
          # probe via /jsz.
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 90); do
            docker exec pg pg_isready -h 127.0.0.1 -U janus >/dev/null 2>&1 && break
            sleep 2
          done
          # Loop exhausted: fail here with the probe visible instead of
          # limping on into the migrate step against a half-started PG.
          docker exec pg pg_isready -h 127.0.0.1 -U janus
          until (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; do sleep 1; done
          until [ "$(docker exec redis redis-cli ping)" = "PONG" ]; do sleep 1; done

      - name: Migrate + start Janus API (two replicas)
        run: |
          go build -o /tmp/janus-api ./server/cmd/janus-api
          JANUS_QUEUE_DRIVER=nats \
            JANUS_PG_HOST=localhost JANUS_PG_USER=janus JANUS_PG_PASSWORD=janus \
            JANUS_PG_DATABASE=janus_test JANUS_PG_SSLMODE=disable \
            JANUS_NATS_URL=nats://localhost:4222 \
            JANUS_REDIS_ADDR=127.0.0.1:6379 \
            JANUS_MIGRATION_AUTO=true JANUS_MIGRATION_PATH=migrations \
            JANUS_AUTH_ENABLED=false \
            JANUS_HTTP_HOST=localhost JANUS_HTTP_PORT=8080 \
            /tmp/janus-api > /tmp/janus-api.log 2>&1 &
          echo $! > /tmp/janus-api.pid
          for i in $(seq 1 60); do
            curl -sf "$JANUS_URL/readyz" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf "$JANUS_URL/readyz"
          # Replica B starts only AFTER A is ready: on a fresh database A is
          # still running migrations while B boots, and B's bootstrap queries
          # the tenants table before it exists -> B fatals instantly and the
          # convergence gate finds port 8081 dead.
          JANUS_QUEUE_DRIVER=nats \
            JANUS_PG_HOST=localhost JANUS_PG_USER=janus JANUS_PG_PASSWORD=janus \
            JANUS_PG_DATABASE=janus_test JANUS_PG_SSLMODE=disable \
            JANUS_NATS_URL=nats://localhost:4222 \
            JANUS_REDIS_ADDR=127.0.0.1:6379 \
            JANUS_MIGRATION_AUTO=false \
            JANUS_AUTH_ENABLED=false \
            JANUS_HTTP_HOST=localhost JANUS_HTTP_PORT=8081 \
            JANUS_GRPC_PORT=9091 \
            /tmp/janus-api > /tmp/janus-api-b.log 2>&1 &
          echo $! > /tmp/janus-api-b.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8081/readyz

      - name: Dependency smoke (API/PG/NATS/Redis + metrics)
        run: JANUS_URL=$JANUS_URL bash scripts/smoke_api_dependencies.sh

      - name: Seven-agent scenario (lifecycle + fanout + idempotency)
        run: JANUS_URL=$JANUS_URL bash scripts/smoke_7_agents.sh

      - name: Two-replica convergence (advisory locks + config version)
        run: |
          JANUS_URL_A=http://localhost:8080 JANUS_URL_B=http://localhost:8081 \
          JANUS_PG_HOST=localhost JANUS_PG_USER=janus PGPASSWORD=janus JANUS_PG_DBNAME=janus_test \
          bash scripts/smoke_two_replica_convergence.sh

      - name: T01-T13 acceptance matrix (audit 2026-10-12)
        run: |
          # The matrix executes the Python and TS SDK test suites, not just
          # type checks — their runner deps must be present.
          (cd sdk/python && python3 -m pip install --quiet -e '.[dev]')
          (cd sdk/typescript && npm ci --silent)
          bash scripts/acceptance_matrix.sh

      - name: Mixed-version lock contention (v1.9.0 + HEAD)
        run: |
          python3 -m pip install --quiet nats-py
          JANUS_PG_HOST=localhost JANUS_PG_USER=janus JANUS_PG_PASSWORD=janus \
          bash scripts/smoke_mixed_version_locks.sh

      - name: Ops chaos (dependency restarts + state persistence)
        env:
          JANUS_PG_DBNAME: janus_test
          JANUS_REDIS_RESTART_CMD: "docker restart redis"
          JANUS_NATS_STOP_CMD: "docker stop nats"
          JANUS_NATS_RESTART_CMD: "docker start nats"
          JANUS_PG_RESTART_CMD: "docker restart pg && sleep 3"
        run: JANUS_URL=$JANUS_URL bash scripts/smoke_ops_chaos.sh

      - name: Release ops (helm lint + migration rollback drill)
        env:
          JANUS_PG_DBNAME: janus_test
        run: bash scripts/smoke_release_ops.sh

      - name: Load baseline (1000 agents / 1000 tasks, p95 gate)
        run: |
          set -o pipefail
          NUM_AGENTS=1000 NUM_MAILBOXES=1000 NUM_TASKS=1000 bash scripts/load_baseline.sh | tee /tmp/load-baseline.log
          echo "## Load baseline trend" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/load-baseline.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-evidence-${{ github.run_id }}
          retention-days: 90
          path: |
            /tmp/janus-api.log
            /tmp/janus-api-b.log
            /tmp/load-baseline.log

      - name: Dump dependency logs on failure
        if: failure()
        run: |
          echo "::group::postgres"; docker logs --tail 100 pg; echo "::endgroup::"
          echo "::group::nats"; docker logs --tail 100 nats; echo "::endgroup::"
          echo "::group::redis"; docker logs --tail 100 redis; echo "::endgroup::"

      - name: Stop Janus API replicas
        if: always()
        run: |
          kill "$(cat /tmp/janus-api.pid)" 2>/dev/null || true
          kill "$(cat /tmp/janus-api-b.pid)" 2>/dev/null || true

  chart-install-upgrade:
    # Real-chart proof on a kind cluster: helm install -> helm upgrade with
    # a changed value, asserting the pre-upgrade migration hook Job runs
    # successfully AND is idempotent (schema_migrations keeps the same
    # version, never dirty). The postgres password is deliberately full of
    # URI delimiters to exercise the chart's DSN escaping (C1 fix) end to
    # end. The janus-api image is built from THIS commit and side-loaded
    # into kind, so a stale published image can never satisfy the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NS: janus-e2e
      RELEASE: janus-core
      PG_PASSWORD: "p@ss#w?rd/x"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.26.0
          # Node image digest from the kind v0.26.0 release notes.
          node_image: kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30
          kubectl_version: v1.31.4
          cluster_name: janus
          wait: 120s

      - name: Install tooling (helm)
        run: |
          set -euo pipefail
          # Pinned download with checksum verification (no curl | bash).
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Build janus-api image (this commit) + load into kind
        run: |
          set -euo pipefail
          docker build -t janus-core:e2e .
          # Dependency images are pulled here (docker.io with an ECR mirror
          # fallback, same as production-gates) and side-loaded into the
          # node so kubelet never hits Docker Hub rate limits mid-run.
          pull() {
            for src in "docker.io/$1" "public.ecr.aws/docker/library/$1"; do
              for attempt in 1 2 3; do
                docker pull "$src" && { docker tag "$src" "$1"; return 0; }
                sleep $((attempt * 10))
              done
            done
            echo "::error::unable to pull $1"; return 1
          }
          pull postgres:16-alpine
          pull nats:2-alpine
          pull redis:7-alpine
          # The migration hook Job image is pinned by the chart itself.
          pull migrate/migrate:v4.19.1
          for img in janus-core:e2e postgres:16-alpine nats:2-alpine redis:7-alpine migrate/migrate:v4.19.1; do
            kind load docker-image "$img" --name janus
          done

      - name: Start in-cluster dependencies (postgres / nats / redis)
        run: |
          set -euo pipefail
          kubectl create namespace "$NS"
          # Chart defaults point at host names postgres / nats / redis, so
          # plain Services with those names satisfy the release without any
          # external dependencies. Flat heredoc: kubectl reads column-0 YAML.
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: POSTGRES_USER
                        value: janus
                      - name: POSTGRES_PASSWORD
                        value: "$PG_PASSWORD"
                      - name: POSTGRES_DB
                        value: janus
                    ports:
                      - containerPort: 5432
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
                targetPort: 5432
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nats
            labels:
              app: nats
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nats
            template:
              metadata:
                labels:
                  app: nats
              spec:
                containers:
                  - name: nats
                    image: nats:2-alpine
                    imagePullPolicy: IfNotPresent
                    args:
                      - -js
                    ports:
                      - containerPort: 4222
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nats
          spec:
            selector:
              app: nats
            ports:
              - port: 4222
                targetPort: 4222
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis
            labels:
              app: redis
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: redis
            template:
              metadata:
                labels:
                  app: redis
              spec:
                containers:
                  - name: redis
                    image: redis:7-alpine
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 6379
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: redis
          spec:
            selector:
              app: redis
            ports:
              - port: 6379
                targetPort: 6379
          EOF
          kubectl -n "$NS" wait --for=condition=available deployment/postgres deployment/nats deployment/redis --timeout=300s
          # Deployment Available only proves the container runs; wait until
          # postgres actually accepts TCP connections (what the pre-install
          # migration hook uses) with a bounded budget. If the budget runs
          # out, dump the pod state before failing so the log names the cause
          # instead of a bare "rejecting connections".
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 150); do
            kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus >/dev/null 2>&1 && break
            sleep 2
          done
          if ! kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus >/dev/null 2>&1; then
            kubectl -n "$NS" describe pod "$PG_POD" || true
            kubectl -n "$NS" logs "$PG_POD" --tail=50 || true
            echo "::error::postgres still not accepting connections after 300s"
            exit 1
          fi
          kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus

      - name: Helm install (special-char postgres password)
        run: |
          set -euo pipefail
          helm install "$RELEASE" deployments/helm/janus-core \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --wait --timeout 5m
          # --wait already gates on pods Ready; assert them explicitly too.
          kubectl -n "$NS" wait --for=condition=available deployment/janus-core --timeout=180s
          kubectl -n "$NS" wait --for=condition=ready pod -l 'app.kubernetes.io/instance=janus-core,!app.kubernetes.io/component' --timeout=180s

      - name: Capture schema_migrations state after install
        run: |
          set -euo pipefail
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" exec "$PG_POD" -- \
            psql -U janus -d janus -tAc "SELECT version, dirty FROM schema_migrations" | tee /tmp/mig-install.txt
          # golang-migrate must land on a clean version row: one integer, dirty=f.
          grep -qE '^[0-9]+\|f$' /tmp/mig-install.txt

      - name: Helm upgrade with changed value (pre-upgrade migration hook)
        run: |
          set -euo pipefail
          helm upgrade "$RELEASE" deployments/helm/janus-core \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=2 \
            --set postgres.password="$PG_PASSWORD" \
            --timeout 5m >/tmp/helm-upgrade.log 2>&1 &
          UPGRADE_PID=$!
          # The chart deletes the hook Job once it succeeds
          # (helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded),
          # so the Job can only be observed while the upgrade is in flight.
          for i in $(seq 1 60); do
            kubectl -n "$NS" get job janus-core-migration >/dev/null 2>&1 && break
            sleep 1
          done
          kubectl -n "$NS" get job janus-core-migration >/dev/null
          kubectl -n "$NS" wait --for=condition=complete job/janus-core-migration --timeout=300s
          wait "$UPGRADE_PID"
          cat /tmp/helm-upgrade.log

      - name: Assert idempotent migrations + Deployment Ready after upgrade
        run: |
          set -euo pipefail
          kubectl -n "$NS" wait --for=condition=available deployment/janus-core --timeout=180s
          kubectl -n "$NS" wait --for=condition=ready pod -l 'app.kubernetes.io/instance=janus-core,!app.kubernetes.io/component' --timeout=180s
          REPLICAS=$(kubectl -n "$NS" get deployment janus-core -o jsonpath='{.spec.replicas}')
          echo "spec.replicas=$REPLICAS"
          [ "$REPLICAS" = "2" ]
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" exec "$PG_POD" -- \
            psql -U janus -d janus -tAc "SELECT version, dirty FROM schema_migrations" | tee /tmp/mig-upgrade.txt
          grep -qE '^[0-9]+\|f$' /tmp/mig-upgrade.txt
          diff /tmp/mig-install.txt /tmp/mig-upgrade.txt
          echo "schema_migrations unchanged across install -> upgrade (migrations idempotent)"

      - name: Port-forward + probe health endpoints
        run: |
          set -euo pipefail
          # /healthz and /readyz live on the public (unauthenticated) mux in
          # server/cmd/janus-api/main.go, so chart-default auth stays on.
          kubectl -n "$NS" port-forward svc/janus-core 18080:8080 >/tmp/port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18080/readyz && break
            sleep 1
          done
          for path in /healthz /readyz; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path")
            echo "$path -> $CODE"
            [ "$CODE" = "200" ]
          done
          curl -sf http://127.0.0.1:18080/readyz

      - name: TLS-mode upgrade (verified gateway + HTTPS endpoints)
        run: |
          set -euo pipefail
          # Self-signed CA + CA-signed server certificate. The SANs cover
          # "localhost" — the in-process grpc-gateway dials its own gRPC
          # server on localhost — and 127.0.0.1 for the port-forward probes.
          # The gateway CA secret lets the gateway VERIFY the gRPC server
          # (eval-5 identity fix). mTLS (clientCaSecret) is deliberately NOT
          # enabled here: it would demand client certificates from the
          # kubelet HTTPS probes, which cannot present one.
          mkdir -p /tmp/tls && cd /tmp/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout ca.key -out ca.crt -days 2 -subj "/CN=janus-nightly-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          cat > server.ext <<'EOF'
          basicConstraints=CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          EOF
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout tls.key -out server.csr -subj "/CN=localhost"
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out tls.crt -days 2 -sha256 -extfile server.ext
          openssl verify -CAfile ca.crt tls.crt
          kubectl -n "$NS" create secret generic janus-tls-server \
            --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key
          kubectl -n "$NS" create secret generic janus-tls-gateway-ca \
            --from-file=ca.crt=ca.crt
          # Seed an API key so the /grpc/ REST probe can pass auth and reach
          # the gateway mux (key_hash = sha256 hex, mirroring auth.hashKey).
          PROBE_KEY="janus_nightly_tls_probe"
          KEY_HASH=$(printf '%s' "$PROBE_KEY" | sha256sum | cut -d' ' -f1)
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" exec "$PG_POD" -- psql -U janus -d janus -tAc \
            "INSERT INTO api_keys (tenant_id, key_hash, name, prefix) VALUES ('t0', '$KEY_HASH', 'nightly-tls-probe', '${PROBE_KEY:0:8}') ON CONFLICT DO NOTHING"
          helm upgrade "$RELEASE" deployments/helm/janus-core \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --set config.tls.enabled=true \
            --set config.tls.existingSecret=janus-tls-server \
            --set config.tls.gatewayCaSecret=janus-tls-gateway-ca \
            --wait --timeout 5m
          kubectl -n "$NS" wait --for=condition=ready pod -l 'app.kubernetes.io/instance=janus-core,!app.kubernetes.io/component' --timeout=300s
          kubectl -n "$NS" port-forward svc/janus-core 18443:8080 >/tmp/port-forward-tls.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --cacert /tmp/tls/ca.crt https://127.0.0.1:18443/readyz && break
            sleep 1
          done
          for path in /healthz /readyz; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/tls/ca.crt "https://127.0.0.1:18443$path")
            echo "TLS $path -> $CODE"
            [ "$CODE" = "200" ]
          done
          # Full round trip: HTTPS -> auth -> gateway mux -> gateway's own
          # verified TLS dial -> gRPC ListAgents. 200 proves the gateway
          # trusted the CA and the server certificate verified as localhost.
          CODE=$(curl -s -o /tmp/grpc-probe.json -w '%{http_code}' \
            --cacert /tmp/tls/ca.crt \
            -H "x-api-key: $PROBE_KEY" \
            "https://127.0.0.1:18443/grpc/v1/tenants/t0/agents")
          echo "TLS /grpc/v1/tenants/t0/agents -> $CODE $(cat /tmp/grpc-probe.json)"
          [ "$CODE" = "200" ]

      - name: TLS-mode negative (wrong gateway CA must break /grpc/)
        run: |
          set -euo pipefail
          # A second, unrelated CA wired as the gateway CA: the gateway must
          # FAIL to verify the gRPC server, so /grpc/ returns 503 while the
          # plain HTTPS health endpoints (no gRPC dial) stay 200. Under the
          # pre-fix InsecureSkipVerify behavior a wrong CA changed nothing —
          # this gate exists to catch exactly that regression.
          cd /tmp/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout wrong-ca.key -out wrong-ca.crt -days 2 -subj "/CN=janus-nightly-wrong-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          kubectl -n "$NS" create secret generic janus-tls-wrong-ca \
            --from-file=ca.crt=wrong-ca.crt
          helm upgrade "$RELEASE" deployments/helm/janus-core \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --set config.tls.enabled=true \
            --set config.tls.existingSecret=janus-tls-server \
            --set config.tls.gatewayCaSecret=janus-tls-wrong-ca \
            --wait --timeout 5m
          kubectl -n "$NS" wait --for=condition=ready pod -l 'app.kubernetes.io/instance=janus-core,!app.kubernetes.io/component' --timeout=300s
          kubectl -n "$NS" port-forward svc/janus-core 18443:8080 >/tmp/port-forward-tls2.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --cacert /tmp/tls/ca.crt https://127.0.0.1:18443/healthz && break
            sleep 1
          done
          PROBE_KEY="janus_nightly_tls_probe"
          CODE=$(curl -s -o /tmp/grpc-wrong-ca.json -w '%{http_code}' \
            --cacert /tmp/tls/ca.crt \
            -H "x-api-key: $PROBE_KEY" \
            "https://127.0.0.1:18443/grpc/v1/tenants/t0/agents")
          echo "wrong-CA /grpc/v1/tenants/t0/agents -> $CODE $(cat /tmp/grpc-wrong-ca.json)"
          [ "$CODE" = "503" ]
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/tls/ca.crt "https://127.0.0.1:18443/healthz")
          echo "wrong-CA /healthz -> $CODE (health must stay up)"
          [ "$CODE" = "200" ]

      - name: Dump cluster state on failure
        if: failure()
        run: |
          set -euo pipefail
          kubectl -n "$NS" get all 2>/dev/null || true
          for p in $(kubectl -n "$NS" get pods -o name 2>/dev/null); do
            echo "::group::$p"
            kubectl -n "$NS" describe "$p" 2>/dev/null | tail -n 40 || true
            kubectl -n "$NS" logs "$p" --all-containers --tail=80 2>/dev/null || true
            echo "::endgroup::"
          done
          helm -n "$NS" status "$RELEASE" 2>/dev/null || true
          cat /tmp/helm-upgrade.log /tmp/port-forward.log 2>/dev/null || true

      - name: Delete kind cluster
        if: always()
        run: |
          set -euo pipefail
          kind delete cluster --name janus
