  "chart-install-upgrade":
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 30
    "env":
      "NS": "janus-e2e"
      "RELEASE": "janus-core"
      "PG_PASSWORD": "p@ss#w?rd/x"
      "SUITE_ID": "chart-install-upgrade"
      "CANDIDATE_SHA": "${{ needs.prepare.outputs.sha }}"
      "EVIDENCE_ARTIFACT": "nightly-evidence-chart-install-upgrade-${{ github.run_id }}-${{ github.run_attempt }}"
      "BINARY_MODE": "shared-candidate"
      "EXPECTED_STEP_IDS_JSON": "[\"artifact_verify\", \"image_verify\", \"create_cluster\", \"install_tools\", \"load_images\", \"start_dependencies\", \"helm_install\", \"install_schema\", \"helm_upgrade\", \"upgrade_schema\", \"health\", \"tls\", \"tls_negative\", \"mtls\"]"
    "steps":
      -
        "name": "Record suite start"
        "run": |
          mkdir -p "$EVIDENCE_DIR"
          date +%s > "$EVIDENCE_DIR/suite-started.txt"
      -
        "name": "Checkout frozen candidate"
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "ref": "${{ needs.prepare.outputs.sha }}"
          "fetch-depth": 0
      -
        "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff"
        "with":
          "go-version-file": "go.work"
          "cache-dependency-path": |-
            go.work.sum
            core/go.sum
            proto/go.sum
            server/go.sum
            cli/go.sum
            sdk/go/go.sum
      -
        "name": "Download shared candidate runtime"
        "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        "with":
          "name": "janus-runtime-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/janus-candidate"
      -
        "name": "Verify candidate runtime"
        "id": "artifact_verify"
        "run": |
          set -euo pipefail
          cd "$JANUS_DIST"
          sha256sum -c SHA256SUMS
          chmod +x bin/* tools/ci.sh
      -
        "name": "Download shared candidate image"
        "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        "with":
          "name": "janus-image-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/janus-candidate/image"
      -
        "name": "Verify candidate image archive"
        "id": "image_verify"
        "run": |
          cd "$JANUS_DIST/image"
          sha256sum -c SHA256SUMS
      -
        "name": "Create kind cluster"
        "uses": "helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa"
        "with":
          "version": "v0.26.0"
          "node_image": "kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30"
          "kubectl_version": "v1.31.4"
          "cluster_name": "janus"
          "wait": "120s"
        "id": "create_cluster"
      -
        "name": "Install tooling (helm)"
        "run": |
          set -euo pipefail
          source /tmp/janus-candidate/tools/ci.sh
          install_tools basic
          helm version
        "id": "install_tools"
      -
        "name": "Load shared candidate image and dependencies into kind"
        "run": |
          set -euo pipefail
          source /tmp/janus-candidate/tools/ci.sh
          docker load -i /tmp/janus-candidate/image/candidate.tar
          docker image inspect janus-core:candidate --format '{{.Id}}' | tee /tmp/candidate-image-id.txt
          docker tag janus-core:candidate janus-core:e2e
          kind_import_deps janus
          kind load docker-image janus-core:e2e --name janus
        "id": "load_images"
      -
        "name": "Start in-cluster dependencies (postgres / nats / redis)"
        "run": |
          set -euo pipefail
          kubectl create namespace "$NS"
          # Chart defaults point at host names postgres / nats / redis, so
          # plain Services with those names satisfy the release without any
          # external dependencies. Flat heredoc: kubectl reads column-0 YAML.
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: POSTGRES_USER
                        value: janus
                      - name: POSTGRES_PASSWORD
                        value: "$PG_PASSWORD"
                      - name: POSTGRES_DB
                        value: janus
                    ports:
                      - containerPort: 5432
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
                targetPort: 5432
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nats
            labels:
              app: nats
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nats
            template:
              metadata:
                labels:
                  app: nats
              spec:
                containers:
                  - name: nats
                    image: nats:2-alpine
                    imagePullPolicy: IfNotPresent
                    args:
                      - -js
                    ports:
                      - containerPort: 4222
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nats
          spec:
            selector:
              app: nats
            ports:
              - port: 4222
                targetPort: 4222
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis
            labels:
              app: redis
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: redis
            template:
              metadata:
                labels:
                  app: redis
              spec:
                containers:
                  - name: redis
                    image: redis:7-alpine
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 6379
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: redis
          spec:
            selector:
              app: redis
            ports:
              - port: 6379
                targetPort: 6379
          EOF
          kubectl -n "$NS" wait --for=condition=available deployment/postgres deployment/nats deployment/redis --timeout=300s
          # Deployment Available only proves the container runs; wait until
          # postgres actually accepts TCP connections (what the pre-install
          # migration hook uses) with a bounded budget. If the budget runs
          # out, dump the pod state before failing so the log names the cause
          # instead of a bare "rejecting connections".
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 150); do
            kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus >/dev/null 2>&1 && break
            sleep 2
          done
          if ! kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus >/dev/null 2>&1; then
            kubectl -n "$NS" describe pod "$PG_POD" || true
            kubectl -n "$NS" logs "$PG_POD" --tail=50 || true
            echo "::error::postgres still not accepting connections after 300s"
            exit 1
          fi
          kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus
        "id": "start_dependencies"
      -
        "name": "Helm install (special-char postgres password)"
        "run": |
          set -euo pipefail
          helm install "$RELEASE" deployments/helm/janus-core \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --wait --timeout 5m
          # --wait already gates on pods Ready; assert them explicitly too.
          kubectl -n "$NS" wait --for=condition=available deployment/janus-core --timeout=180s
          "$GITHUB_WORKSPACE/scripts/wait_pods_ready.sh" "$NS" 180s
        "id": "helm_install"
      -
        "name": "Capture schema_migrations state after install"
        "run": |
          set -euo pipefail
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" exec "$PG_POD" -- \
            psql -U janus -d janus -tAc "SELECT version, dirty FROM schema_migrations" | tee /tmp/mig-install.txt
          # golang-migrate must land on a clean version row: one integer, dirty=f.
          grep -qE '^[0-9]+\|f$' /tmp/mig-install.txt
        "id": "install_schema"
      -
        "name": "Helm upgrade with changed value (pre-upgrade migration hook)"
        "run": |
          set -euo pipefail
          helm upgrade "$RELEASE" deployments/helm/janus-core \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=2 \
            --set postgres.password="$PG_PASSWORD" \
            --timeout 5m >/tmp/helm-upgrade.log 2>&1 &
          UPGRADE_PID=$!
          # The chart deletes the hook Job once it succeeds
          # (helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded),
          # so the Job can only be observed while the upgrade is in flight.
          for i in $(seq 1 60); do
            kubectl -n "$NS" get job janus-core-migration >/dev/null 2>&1 && break
            sleep 1
          done
          kubectl -n "$NS" get job janus-core-migration >/dev/null
          kubectl -n "$NS" wait --for=condition=complete job/janus-core-migration --timeout=300s
          wait "$UPGRADE_PID"
          cat /tmp/helm-upgrade.log
        "id": "helm_upgrade"
      -
        "name": "Assert idempotent migrations + Deployment Ready after upgrade"
        "run": |
          set -euo pipefail
          kubectl -n "$NS" wait --for=condition=available deployment/janus-core --timeout=180s
          "$GITHUB_WORKSPACE/scripts/wait_pods_ready.sh" "$NS" 180s
          REPLICAS=$(kubectl -n "$NS" get deployment janus-core -o jsonpath='{.spec.replicas}')
          echo "spec.replicas=$REPLICAS"
          [ "$REPLICAS" = "2" ]
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" exec "$PG_POD" -- \
            psql -U janus -d janus -tAc "SELECT version, dirty FROM schema_migrations" | tee /tmp/mig-upgrade.txt
          grep -qE '^[0-9]+\|f$' /tmp/mig-upgrade.txt
          diff /tmp/mig-install.txt /tmp/mig-upgrade.txt
          echo "schema_migrations unchanged across install -> upgrade (migrations idempotent)"
        "id": "upgrade_schema"
      -
        "name": "Port-forward + probe health endpoints"
        "run": |
          set -euo pipefail
          # /healthz and /readyz live on the public (unauthenticated) mux in
          # server/cmd/janus-api/main.go, so chart-default auth stays on.
          kubectl -n "$NS" port-forward svc/janus-core 18080:8080 >/tmp/port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18080/readyz && break
            sleep 1
          done
          for path in /healthz /readyz; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path")
            echo "$path -> $CODE"
            [ "$CODE" = "200" ]
          done
          curl -sf http://127.0.0.1:18080/readyz
        "id": "health"
      -
        "name": "TLS-mode upgrade (verified gateway + HTTPS endpoints)"
        "run": |
          set -euo pipefail
          # Self-signed CA + CA-signed server certificate. The SANs cover
          # "localhost" — the in-process grpc-gateway dials its own gRPC
          # server on localhost — and 127.0.0.1 for the port-forward probes.
          # The gateway CA secret lets the gateway VERIFY the gRPC server
          # (eval-5 identity fix). mTLS (clientCaSecret) is deliberately NOT
          # enabled here: it would demand client certificates from the
          # kubelet HTTPS probes, which cannot present one.
          mkdir -p /tmp/tls && cd /tmp/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout ca.key -out ca.crt -days 2 -subj "/CN=janus-nightly-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          cat > server.ext <<'EOF'
          basicConstraints=CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          EOF
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout tls.key -out server.csr -subj "/CN=localhost"
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out tls.crt -days 2 -sha256 -extfile server.ext
          openssl verify -CAfile ca.crt tls.crt
          kubectl -n "$NS" create secret generic janus-tls-server \
            --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key
          kubectl -n "$NS" create secret generic janus-tls-gateway-ca \
            --from-file=ca.crt=ca.crt
          # Seed an API key so the /grpc/ REST probe can pass auth and reach
          # the gateway mux (key_hash = sha256 hex, mirroring auth.hashKey).
          PROBE_KEY="janus_nightly_tls_probe"
          KEY_HASH=$(printf '%s' "$PROBE_KEY" | sha256sum | cut -d' ' -f1)
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" exec "$PG_POD" -- psql -U janus -d janus -tAc \
            "INSERT INTO api_keys (tenant_id, key_hash, name, prefix) VALUES ('t0', '$KEY_HASH', 'nightly-tls-probe', '${PROBE_KEY:0:8}') ON CONFLICT DO NOTHING"
          helm upgrade "$RELEASE" "$GITHUB_WORKSPACE/deployments/helm/janus-core" \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --set config.tls.enabled=true \
            --set config.tls.existingSecret=janus-tls-server \
            --set config.tls.gatewayCaSecret=janus-tls-gateway-ca \
            --wait --timeout 5m
          "$GITHUB_WORKSPACE/scripts/wait_pods_ready.sh" "$NS" 300s
          kubectl -n "$NS" port-forward svc/janus-core 18443:8080 >/tmp/port-forward-tls.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --cacert /tmp/tls/ca.crt https://127.0.0.1:18443/readyz && break
            sleep 1
          done
          for path in /healthz /readyz; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/tls/ca.crt "https://127.0.0.1:18443$path")
            echo "TLS $path -> $CODE"
            [ "$CODE" = "200" ]
          done
          # Full round trip: HTTPS -> auth -> gateway mux -> gateway's own
          # verified TLS dial -> gRPC ListAgents. 200 proves the gateway
          # trusted the CA and the server certificate verified as localhost.
          CODE=$(curl -s -o /tmp/grpc-probe.json -w '%{http_code}' \
            --cacert /tmp/tls/ca.crt \
            -H "x-api-key: $PROBE_KEY" \
            "https://127.0.0.1:18443/grpc/v1/tenants/t0/agents")
          echo "TLS /grpc/v1/tenants/t0/agents -> $CODE $(cat /tmp/grpc-probe.json)"
          [ "$CODE" = "200" ]
        "id": "tls"
      -
        "name": "TLS-mode negative (wrong gateway CA must break /grpc/)"
        "run": |
          set -euo pipefail
          # A second, unrelated CA wired as the gateway CA: the gateway must
          # FAIL to verify the gRPC server, so /grpc/ returns 503 while the
          # plain HTTPS health endpoints (no gRPC dial) stay 200. Under the
          # pre-fix InsecureSkipVerify behavior a wrong CA changed nothing —
          # this gate exists to catch exactly that regression.
          cd /tmp/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout wrong-ca.key -out wrong-ca.crt -days 2 -subj "/CN=janus-nightly-wrong-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          kubectl -n "$NS" create secret generic janus-tls-wrong-ca \
            --from-file=ca.crt=wrong-ca.crt
          helm upgrade "$RELEASE" "$GITHUB_WORKSPACE/deployments/helm/janus-core" \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --set config.tls.enabled=true \
            --set config.tls.existingSecret=janus-tls-server \
            --set config.tls.gatewayCaSecret=janus-tls-wrong-ca \
            --wait --timeout 5m
          "$GITHUB_WORKSPACE/scripts/wait_pods_ready.sh" "$NS" 300s
          kubectl -n "$NS" port-forward svc/janus-core 18443:8080 >/tmp/port-forward-tls2.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --cacert /tmp/tls/ca.crt https://127.0.0.1:18443/healthz && break
            sleep 1
          done
          PROBE_KEY="janus_nightly_tls_probe"
          CODE=$(curl -s -o /tmp/grpc-wrong-ca.json -w '%{http_code}' \
            --cacert /tmp/tls/ca.crt \
            -H "x-api-key: $PROBE_KEY" \
            "https://127.0.0.1:18443/grpc/v1/tenants/t0/agents")
          echo "wrong-CA /grpc/v1/tenants/t0/agents -> $CODE $(cat /tmp/grpc-wrong-ca.json)"
          [ "$CODE" = "503" ]
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/tls/ca.crt "https://127.0.0.1:18443/healthz")
          echo "wrong-CA /healthz -> $CODE (health must stay up)"
          [ "$CODE" = "200" ]
        "id": "tls_negative"
      -
        "name": "mTLS-mode upgrade (client CA + exec probes + client-cert round trip)"
        "run": |
          set -euo pipefail
          # eval-6 4B: a clientCaSecret deployment must stay operable. The
          # server now requires client certificates on HTTP and gRPC, so:
          # (a) kubelet probes switch to exec janus-healthcheck presenting
          #     the probeClientCertSecret pair — Ready is only reachable if
          #     those exec probes pass under mTLS,
          # (b) the gateway presents its own client pair
          #     (gateway.clientCertSecret) signed by the client CA, and
          # (c) external clients WITHOUT a client certificate are rejected
          #     at the TLS handshake, not with an HTTP status.
          cd /tmp/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout client-ca.key -out client-ca.crt -days 2 -subj "/CN=janus-nightly-client-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          cat > client.ext <<'EOF'
          basicConstraints=CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=clientAuth
          EOF
          for name in probe gw-client curl-client; do
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
              -keyout $name.key -out $name.csr -subj "/CN=janus-nightly-$name"
            openssl x509 -req -in $name.csr -CA client-ca.crt -CAkey client-ca.key -CAcreateserial \
              -out $name.crt -days 2 -sha256 -extfile client.ext
          done
          openssl verify -CAfile client-ca.crt probe.crt gw-client.crt curl-client.crt
          kubectl -n "$NS" create secret generic janus-tls-client-ca \
            --from-file=ca.crt=client-ca.crt
          kubectl -n "$NS" create secret generic janus-tls-probe \
            --from-file=tls.crt=probe.crt --from-file=tls.key=probe.key
          kubectl -n "$NS" create secret generic janus-tls-gw-client \
            --from-file=tls.crt=gw-client.crt --from-file=tls.key=gw-client.key
          # Recreate the server secret WITH ca.crt so the exec probes take
          # the verify branch (-ca-file /etc/janus/tls/ca.crt).
          kubectl -n "$NS" delete secret janus-tls-server
          kubectl -n "$NS" create secret generic janus-tls-server \
            --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key --from-file=ca.crt=ca.crt
          helm upgrade "$RELEASE" "$GITHUB_WORKSPACE/deployments/helm/janus-core" \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=e2e \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --set config.tls.enabled=true \
            --set config.tls.existingSecret=janus-tls-server \
            --set config.tls.gatewayCaSecret=janus-tls-gateway-ca \
            --set config.tls.clientCaSecret=janus-tls-client-ca \
            --set config.tls.gateway.clientCertSecret=janus-tls-gw-client \
            --set config.tls.probeClientCertSecret=janus-tls-probe \
            --wait --timeout 5m
          # Ready under mTLS is only reachable through passing exec probes;
          # assert the live Deployment really carries them (guards against
          # the probes silently staying httpGet and never failing).
          kubectl -n "$NS" get deployment janus-core \
            -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.exec.command}' \
            | grep -q janus-healthcheck
          kubectl -n "$NS" rollout status deployment/janus-core --timeout=300s
          POD=$(kubectl -n "$NS" get pod -l 'app.kubernetes.io/instance=janus-core,!app.kubernetes.io/component' -o jsonpath='{.items[0].metadata.name}')
          # The probe binary itself, in-pod, loopback: verifies the server
          # cert against the mounted CA and presents the probe pair.
          kubectl -n "$NS" exec "$POD" -- /usr/local/bin/janus-healthcheck \
            -url https://127.0.0.1:8080/healthz \
            -ca-file /etc/janus/tls/ca.crt \
            -client-cert /etc/janus/probe-cert/tls.crt \
            -client-key /etc/janus/probe-cert/tls.key
          # Without a client certificate the same probe must fail (fail-closed).
          if kubectl -n "$NS" exec "$POD" -- /usr/local/bin/janus-healthcheck \
            -url https://127.0.0.1:8080/healthz -ca-file /etc/janus/tls/ca.crt \
            >/dev/null 2>&1; then
            echo "::error::healthcheck without client cert unexpectedly succeeded"
            exit 1
          fi
          kubectl -n "$NS" port-forward svc/janus-core 18543:8080 >/tmp/port-forward-mtls.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --cacert /tmp/tls/ca.crt \
              --cert /tmp/tls/curl-client.crt --key /tmp/tls/curl-client.key \
              https://127.0.0.1:18543/readyz && break
            sleep 1
          done
          # /healthz via the probe pair.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/tls/ca.crt \
            --cert /tmp/tls/probe.crt --key /tmp/tls/probe.key \
            https://127.0.0.1:18543/healthz)
          echo "mTLS /healthz (probe pair) -> $CODE"
          [ "$CODE" = "200" ]
          # Secure metrics scraping: /metrics reachable with a client cert.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/tls/ca.crt \
            --cert /tmp/tls/curl-client.crt --key /tmp/tls/curl-client.key \
            https://127.0.0.1:18543/metrics)
          echo "mTLS /metrics -> $CODE"
          [ "$CODE" = "200" ]
          # Full gateway round trip WITH a client cert: HTTPS -> auth ->
          # gateway mux -> gateway's own mTLS dial -> gRPC ListAgents.
          PROBE_KEY="janus_nightly_tls_probe"
          CODE=$(curl -s -o /tmp/grpc-mtls.json -w '%{http_code}' \
            --cacert /tmp/tls/ca.crt \
            --cert /tmp/tls/curl-client.crt --key /tmp/tls/curl-client.key \
            -H "x-api-key: $PROBE_KEY" \
            "https://127.0.0.1:18543/grpc/v1/tenants/t0/agents")
          echo "mTLS /grpc/v1/tenants/t0/agents -> $CODE $(cat /tmp/grpc-mtls.json)"
          [ "$CODE" = "200" ]
          # WITHOUT a client certificate: TLS handshake rejection (non-zero
          # curl exit), never an HTTP status.
          if curl -s -o /dev/null --cacert /tmp/tls/ca.crt \
            https://127.0.0.1:18543/healthz; then
            echo "::error::connection without client cert unexpectedly succeeded"
            exit 1
          else
            echo "no-client-cert rejected at TLS handshake (curl exit $?)"
          fi
        "id": "mtls"
      -
        "name": "Dump cluster state on failure"
        "if": "failure()"
        "run": |
          set -euo pipefail
          kubectl -n "$NS" get all 2>/dev/null || true
          for p in $(kubectl -n "$NS" get pods -o name 2>/dev/null); do
            echo "::group::$p"
            kubectl -n "$NS" describe "$p" 2>/dev/null | tail -n 40 || true
            kubectl -n "$NS" logs "$p" --all-containers --tail=80 2>/dev/null || true
            echo "::endgroup::"
          done
          helm -n "$NS" status "$RELEASE" 2>/dev/null || true
          cat /tmp/helm-upgrade.log /tmp/port-forward.log 2>/dev/null || true
        "id": "dump_failure"
      -
        "name": "Snapshot Kubernetes evidence before cleanup"
        "id": "kind_snapshot"
        "if": "${{ always() }}"
        "env":
          "KIND_CLUSTER": "janus"
        "run": |
          set -uo pipefail
          out="${EVIDENCE_DIR:-/tmp/janus-evidence}/kubernetes-$KIND_CLUSTER"
          mkdir -p "$out"
          # Do not dump Secrets or the runner environment into artifacts.
          kubectl version --client -o yaml > "$out/kubectl-version.yml" 2>&1 || true
          kubectl -n "$NS" get deployments,services,pods,jobs,pvc -o yaml > "$out/resources.yml" 2>&1 || true
          kubectl -n "$NS" get events --sort-by=.metadata.creationTimestamp > "$out/events.txt" 2>&1 || true
          helm -n "$NS" history "$RELEASE" -o json > "$out/helm-history.json" 2>&1 || true
          kubectl -n "$NS" get pods -o name > "$out/pods.txt" 2>/dev/null || true
          while IFS= read -r pod; do
            [ -n "$pod" ] || continue
            name="${pod#pod/}"
            kubectl -n "$NS" describe "$pod" > "$out/$name.describe.txt" 2>&1 || true
            kubectl -n "$NS" logs "$pod" --all-containers=true --timestamps=true > "$out/$name.log" 2>&1 || true
          done < "$out/pods.txt"
      -
        "name": "Delete kind cluster"
        "if": "always()"
        "run": |
          set -euo pipefail
          kind delete cluster --name janus
        "id": "delete_cluster"
      -
        "name": "Collect logs before runner cleanup"
        "id": "collect"
        "if": "${{ always() }}"
        "run": |
          set -uo pipefail
          if [[ -f "$JANUS_DIST/tools/ci.sh" ]]; then
            source "$JANUS_DIST/tools/ci.sh"
            collect_evidence
          else
            mkdir -p "$EVIDENCE_DIR"
            docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true
          fi
      -
        "name": "Write machine-readable suite result"
        "id": "result"
        "if": "${{ always() }}"
        "env":
          "STEPS_JSON": "${{ toJSON(steps) }}"
          "JOB_STATUS": "${{ job.status }}"
        "run": |
          set -euo pipefail
          if [[ -f "$JANUS_DIST/tools/finalize.py" && -f "$JANUS_DIST/manifest.json" ]]; then
            python3 "$JANUS_DIST/tools/finalize.py"
          else
            python3 - <<'JANUS_FALLBACK'
          import json, os, pathlib
          p = pathlib.Path(os.environ['EVIDENCE_DIR']); p.mkdir(parents=True, exist_ok=True)
          r = dict(suite_id=os.environ['SUITE_ID'], status='FAIL', candidate_sha=os.environ.get('CANDIDATE_SHA', ''), candidate_image_id='', problems=['candidate runtime unavailable; suite not proven'], artifact_name=os.environ['EVIDENCE_ARTIFACT'])
          (p / 'result.json').write_text(json.dumps(r, indent=2) + '\n')
          raise SystemExit(1)
          JANUS_FALLBACK
          fi
      -
        "name": "Upload ${{ env.EVIDENCE_ARTIFACT }}"
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "with":
          "name": "${{ env.EVIDENCE_ARTIFACT }}"
          "path": "/tmp/janus-evidence"
          "retention-days": 90
          "if-no-files-found": "error"
        "if": "${{ always() }}"
    "needs":
      - "prepare"
      - "build"
    "if": "${{ needs.prepare.outputs.functional == 'true' }}"
  "chart-upgrade-rollback":
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 40
    "env":
      "NS": "janus-e2e"
      "RELEASE": "janus-core"
      "PG_PASSWORD": "ga09_v190_plain_pw"
      "TENANT": "ga09"
      "AGENT": "ga09-agent"
      "MAILBOX": "ga09-mb"
      "API_KEY": "janus_ga09_upgrade_probe"
      "OLD_TAG": "${{ needs.prepare.outputs.baseline_ref }}"
      "OLD_COMMIT": "${{ needs.prepare.outputs.baseline_sha }}"
      "SUITE_ID": "chart-upgrade-rollback"
      "CANDIDATE_SHA": "${{ needs.prepare.outputs.sha }}"
      "EVIDENCE_ARTIFACT": "nightly-evidence-chart-upgrade-rollback-${{ github.run_id }}-${{ github.run_attempt }}"
      "BINARY_MODE": "shared-candidate"
      "EXPECTED_STEP_IDS_JSON": "[\"artifact_verify\", \"image_verify\", \"create_cluster\", \"install_tools\", \"load_images\", \"start_dependencies\", \"helm_install_old\", \"seed_old_state\", \"helm_upgrade\", \"assert_upgrade\", \"helm_rollback\"]"
    "steps":
      -
        "name": "Record suite start"
        "run": |
          mkdir -p "$EVIDENCE_DIR"
          date +%s > "$EVIDENCE_DIR/suite-started.txt"
      -
        "name": "Checkout frozen candidate"
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "ref": "${{ needs.prepare.outputs.sha }}"
          "fetch-depth": 0
      -
        "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff"
        "with":
          "go-version-file": "go.work"
          "cache-dependency-path": |-
            go.work.sum
            core/go.sum
            proto/go.sum
            server/go.sum
            cli/go.sum
            sdk/go/go.sum
      -
        "name": "Download shared candidate runtime"
        "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        "with":
          "name": "janus-runtime-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/janus-candidate"
      -
        "name": "Verify candidate runtime"
        "id": "artifact_verify"
        "run": |
          set -euo pipefail
          cd "$JANUS_DIST"
          sha256sum -c SHA256SUMS
          chmod +x bin/* tools/ci.sh
      -
        "name": "Download shared candidate image"
        "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        "with":
          "name": "janus-image-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "/tmp/janus-candidate/image"
      -
        "name": "Verify candidate image archive"
        "id": "image_verify"
        "run": |
          cd "$JANUS_DIST/image"
          sha256sum -c SHA256SUMS
      -
        "name": "Create kind cluster"
        "uses": "helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa"
        "with":
          "version": "v0.26.0"
          "node_image": "kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30"
          "kubectl_version": "v1.31.4"
          "cluster_name": "janus-ga09"
          "wait": "120s"
        "id": "create_cluster"
      -
        "name": "Install tooling (helm)"
        "run": |
          set -euo pipefail
          source /tmp/janus-candidate/tools/ci.sh
          install_tools basic
          helm version
        "id": "install_tools"
      -
        "name": "Build frozen OLD baseline and load shared candidate"
        "run": |
          set -euo pipefail
          source /tmp/janus-candidate/tools/ci.sh
          : "${OLD_TAG:?prepare must provide the frozen baseline ref}"
          : "${OLD_COMMIT:?prepare must provide the frozen baseline SHA}"
          OLD_RESOLVED=$(git rev-parse --verify "${OLD_COMMIT}^{commit}")
          CANDIDATE_COMMIT=$(git rev-parse HEAD)
          [ "$OLD_RESOLVED" = "$OLD_COMMIT" ] || { echo "::error::baseline SHA did not resolve exactly"; exit 1; }
          [ "$OLD_RESOLVED" != "$CANDIDATE_COMMIT" ] || { echo "::error::cross-version baseline equals candidate; upgrade proof is invalid"; exit 1; }
          # Build only the OLD source. Every candidate consumer loads the same image
          # produced by the build job; do not rebuild it in a scenario job.
          git worktree add --detach /tmp/janus-old "$OLD_COMMIT"
          trap 'git worktree remove --force /tmp/janus-old >/dev/null 2>&1 || true' EXIT
          docker build --provenance=false --sbom=false -t janus-core:old /tmp/janus-old
          git worktree remove /tmp/janus-old
          trap - EXIT
          docker load -i /tmp/janus-candidate/image/candidate.tar
          {
            echo "$OLD_TAG baseline commit = $OLD_RESOLVED"
            echo "candidate commit = $CANDIDATE_COMMIT"
            echo "janus-core:old = $(docker image inspect janus-core:old --format '{{.Id}}')"
            echo "janus-core:candidate = $(docker image inspect janus-core:candidate --format '{{.Id}}')"
          } | tee /tmp/ga09-images.txt
          kind_import_deps janus-ga09
          kind load docker-image janus-core:old janus-core:candidate --name janus-ga09
        "id": "load_images"
      -
        "name": "Start in-cluster dependencies (postgres / nats / redis)"
        "run": |
          set -euo pipefail
          kubectl create namespace "$NS"
          # Chart defaults point at host names postgres / nats / redis, so
          # plain Services with those names satisfy the release without any
          # external dependencies. Flat heredoc: kubectl reads column-0 YAML.
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: POSTGRES_USER
                        value: janus
                      - name: POSTGRES_PASSWORD
                        value: "$PG_PASSWORD"
                      - name: POSTGRES_DB
                        value: janus
                    ports:
                      - containerPort: 5432
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
                targetPort: 5432
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nats
            labels:
              app: nats
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nats
            template:
              metadata:
                labels:
                  app: nats
              spec:
                containers:
                  - name: nats
                    image: nats:2-alpine
                    imagePullPolicy: IfNotPresent
                    args:
                      - -js
                    ports:
                      - containerPort: 4222
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nats
          spec:
            selector:
              app: nats
            ports:
              - port: 4222
                targetPort: 4222
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis
            labels:
              app: redis
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: redis
            template:
              metadata:
                labels:
                  app: redis
              spec:
                containers:
                  - name: redis
                    image: redis:7-alpine
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 6379
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: redis
          spec:
            selector:
              app: redis
            ports:
              - port: 6379
                targetPort: 6379
          EOF
          kubectl -n "$NS" wait --for=condition=available deployment/postgres deployment/nats deployment/redis --timeout=300s
          # Deployment Available only proves the container runs; wait until
          # postgres actually accepts TCP connections (what the pre-install
          # migration hook uses) with a bounded budget. If the budget runs
          # out, dump the pod state before failing so the log names the cause
          # instead of a bare "rejecting connections".
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 150); do
            kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus >/dev/null 2>&1 && break
            sleep 2
          done
          if ! kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus >/dev/null 2>&1; then
            kubectl -n "$NS" describe pod "$PG_POD" || true
            kubectl -n "$NS" logs "$PG_POD" --tail=50 || true
            echo "::error::postgres still not accepting connections after 300s"
            exit 1
          fi
          kubectl -n "$NS" exec "$PG_POD" -- pg_isready -h 127.0.0.1 -U janus -d janus
        "id": "start_dependencies"
      -
        "name": "Helm install with the frozen OLD baseline image"
        "run": |
          set -euo pipefail
          helm install "$RELEASE" "$GITHUB_WORKSPACE/deployments/helm/janus-core" \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=old \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --wait --timeout 5m
          # The pre-install migration hook applied the CURRENT chart schema
          # (schema.sql through 000020) and the OLD binary booted on it —
          # exactly the migrate-then-restart posture the repo commits to
          # (000020's ledger-PK comment + smoke_mixed_version_locks.sh).
          # --wait already gates on pods Ready; assert them explicitly too.
          kubectl -n "$NS" wait --for=condition=available deployment/janus-core --timeout=180s
          "$GITHUB_WORKSPACE/scripts/wait_pods_ready.sh" "$NS" 180s
          IMAGE=$(kubectl -n "$NS" get deployment janus-core -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "image after install: $IMAGE"
          [ "$IMAGE" = "janus-core:old" ] || { echo "::error::install did not land the OLD image ($IMAGE)"; exit 1; }
        "id": "helm_install_old"
      -
        "name": "Seed in-flight business state through the OLD API"
        "run": |
          set -euo pipefail
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          psqlq() { kubectl -n "$NS" exec "$PG_POD" -- psql -U janus -d janus -tAc "$1"; }
          # Seed the API key exactly like the mTLS leg (key_hash = sha256
          # hex, mirroring auth.hashKey; the validator matches
          # prefix = key[:8] AND key_hash on EVERY request, so a row
          # inserted against the running old pod authenticates it).
          # platform:admin is mandatory here, not decoration: POST
          # /v1/tenants demands ScopePlatformAdmin on the OLD binary AND HEAD,
          # and an empty-scope key is deliberately refused platform
          # authority by Principal.HasScope on both versions.
          KEY_HASH=$(printf '%s' "$API_KEY" | sha256sum | cut -d' ' -f1)
          psqlq "INSERT INTO api_keys (tenant_id, key_hash, name, prefix, scopes) VALUES ('$TENANT', '$KEY_HASH', 'ga09-upgrade-lane', '${API_KEY:0:8}', '{platform:admin,task:read,task:write}') ON CONFLICT DO NOTHING"
          kubectl -n "$NS" port-forward svc/janus-core 18081:8080 >/tmp/ga09-pf-seed.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 5 http://127.0.0.1:18081/readyz && break
            sleep 1
          done
          curl -sf -o /dev/null --max-time 5 http://127.0.0.1:18081/readyz || { echo "::error::old release never became ready on 18081"; exit 1; }
          AUTH=(-H "x-api-key: $API_KEY" -H 'Content-Type: application/json')
          code() { curl -s -o /tmp/ga09-body.json -w '%{http_code}' --max-time 10 "$@"; }
          CODE=$(code -X POST http://127.0.0.1:18081/v1/tenants "${AUTH[@]}" -d "{\"id\":\"$TENANT\",\"name\":\"GA-09\"}")
          echo "POST /v1/tenants -> $CODE $(cat /tmp/ga09-body.json)"
          [ "$CODE" = "201" ] || { echo "::error::tenant create through OLD binary -> $CODE"; exit 1; }
          CODE=$(code -X POST "http://127.0.0.1:18081/v1/tenants/$TENANT/agents" "${AUTH[@]}" -d "{\"id\":\"$AGENT\",\"display_name\":\"GA-09 upgrade lane\",\"protocol\":\"a2a\"}")
          echo "POST agents -> $CODE $(cat /tmp/ga09-body.json)"
          [ "$CODE" = "201" ] || { echo "::error::agent create through OLD binary -> $CODE"; exit 1; }
          CODE=$(code -X POST "http://127.0.0.1:18081/v1/tenants/$TENANT/mailboxes" "${AUTH[@]}" -d "{\"id\":\"$MAILBOX\",\"agent_id\":\"$AGENT\"}")
          echo "POST mailboxes -> $CODE $(cat /tmp/ga09-body.json)"
          [ "$CODE" = "201" ] || { echo "::error::mailbox create through OLD binary -> $CODE"; exit 1; }
          task_body() { # $1 = task id; same envelope shape the mixed-version smoke publishes
            printf '{"id":"%s","source_agent":"%s","target_type":"mailbox","target_value":"%s","envelope":{"janus_version":"0.3","task_id":"%s","tenant_id":"%s","source_agent":"%s","target":{"type":"mailbox","value":"%s"},"payload":{"type":"smoke","content":"ga09"},"trace":{"trace_id":"ga09-%s"}}}' \
              "$1" "$AGENT" "$MAILBOX" "$1" "$TENANT" "$AGENT" "$MAILBOX" "$1"
          }
          pull_until() { # $1 = local port, $2 = task id; prints the lease id on stdout
            local lease="" got="" resp=""
            for i in $(seq 1 90); do
              resp=$(curl -sf --max-time 5 -X POST "http://127.0.0.1:$1/v1/tenants/$TENANT/mailboxes/$MAILBOX/pull" \
                -H "x-api-key: $API_KEY" -H 'Content-Type: application/json' -d "{\"agent_id\":\"$AGENT\"}" 2>/dev/null || echo "")
              got=$(printf '%s' "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('task') or {}; print(t.get('id',''))" 2>/dev/null || echo "")
              if [ "$got" = "$2" ]; then
                lease=$(printf '%s' "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('lease',{}).get('lease_id',''))")
                break
              fi
              sleep 1
            done
            if [ -z "$lease" ]; then
              echo "::error::pull through the OLD binary never delivered task $2 (last response: $resp)" >&2
              return 1
            fi
            printf '%s' "$lease"
          }
          # Completed task: full create -> pull -> ack round trip on the OLD
          # binary, so a terminal row exists to re-verify on both sides.
          CODE=$(code -X POST "http://127.0.0.1:18081/v1/tenants/$TENANT/tasks" "${AUTH[@]}" -d "$(task_body ga09-done-1)")
          echo "POST tasks(ga09-done-1) -> $CODE"
          [ "$CODE" = "201" ] || { echo "::error::done-task create through OLD binary -> $CODE $(cat /tmp/ga09-body.json)"; exit 1; }
          DONE_LEASE=$(pull_until 18081 ga09-done-1)
          CODE=$(code -X POST "http://127.0.0.1:18081/v1/tenants/$TENANT/tasks/ga09-done-1/ack" "${AUTH[@]}" -d "{\"lease_id\":\"$DONE_LEASE\",\"agent_id\":\"$AGENT\",\"result_ref\":\"ga09://done\"}")
          echo "ack ga09-done-1 -> $CODE"
          [ "$CODE" = "200" ] || { echo "::error::ack of ga09-done-1 through OLD binary -> $CODE $(cat /tmp/ga09-body.json)"; exit 1; }
          # In-flight task: pull + start, lease held and NOT acked.
          CODE=$(code -X POST "http://127.0.0.1:18081/v1/tenants/$TENANT/tasks" "${AUTH[@]}" -d "$(task_body ga09-held-1)")
          echo "POST tasks(ga09-held-1) -> $CODE"
          [ "$CODE" = "201" ] || { echo "::error::held-task create through OLD binary -> $CODE $(cat /tmp/ga09-body.json)"; exit 1; }
          HELD_LEASE=$(pull_until 18081 ga09-held-1)
          CODE=$(code -X POST "http://127.0.0.1:18081/v1/tenants/$TENANT/tasks/ga09-held-1/start" "${AUTH[@]}" -d "{\"lease_id\":\"$HELD_LEASE\",\"agent_id\":\"$AGENT\"}")
          echo "start ga09-held-1 -> $CODE"
          [ "$CODE" = "200" ] || { echo "::error::start of ga09-held-1 through OLD binary -> $CODE $(cat /tmp/ga09-body.json)"; exit 1; }
          HELD_STATUS=$(psqlq "SELECT status FROM tasks WHERE tenant_id='$TENANT' AND id='ga09-held-1'")
          echo "held task status after pull+start via OLD binary: $HELD_STATUS"
          OPEN=$(psqlq "SELECT count(*) FROM task_attempts WHERE tenant_id='$TENANT' AND lease_id='$HELD_LEASE' AND finished_at IS NULL")
          [ "$OPEN" = "1" ] || { echo "::error::held lease has $OPEN open attempt rows (want 1)"; exit 1; }
          # Wait for the audit projector to drain the outbox, then snapshot
          # the row count as the survival baseline.
          AUDIT_COUNT=0
          for i in $(seq 1 60); do
            AUDIT_COUNT=$(psqlq "SELECT count(*) FROM audit_event_projection WHERE tenant_id='$TENANT'")
            [ "$AUDIT_COUNT" -ge 1 ] && break
            sleep 2
          done
          echo "audit_event_projection rows for $TENANT: $AUDIT_COUNT"
          [ "$AUDIT_COUNT" -ge 1 ] || { echo "::error::no audit events projected for $TENANT"; exit 1; }
          SCHEMA_AT_INSTALL=$(psqlq "SELECT version FROM schema_migrations")
          echo "schema_migrations version at install: $SCHEMA_AT_INSTALL (dirty=$(psqlq "SELECT dirty FROM schema_migrations"))"
          {
            echo "GA09_HELD_LEASE=$HELD_LEASE"
            echo "GA09_HELD_STATUS=$HELD_STATUS"
            echo "GA09_AUDIT_COUNT=$AUDIT_COUNT"
            echo "GA09_SCHEMA_AT_INSTALL=$SCHEMA_AT_INSTALL"
          } >> "$GITHUB_ENV"
          # Lease keeper: Pull gives the lease the mailbox ack_wait clock
          # (default 300s), but keep heartbeat_at fresh every 15s across
          # the upgrade window so the lease-expiry sweeper never reclaims
          # the task mid-proof. The port-forward re-establishes itself when
          # the pod it was pinned to is replaced by the upgrade — the same
          # heartbeat endpoint must keep working through the NEW binary.
          rm -f /tmp/ga09-hb.stop
          (
            while [ ! -f /tmp/ga09-hb.stop ]; do
              kubectl -n "$NS" port-forward svc/janus-core 18084:8080 >>/tmp/ga09-hb.log 2>&1 &
              HB_PF=$!
              sleep 2
              while kill -0 "$HB_PF" 2>/dev/null && [ ! -f /tmp/ga09-hb.stop ]; do
                curl -sf --max-time 5 -X POST "http://127.0.0.1:18084/v1/tenants/$TENANT/tasks/ga09-held-1/heartbeat" \
                  -H "x-api-key: $API_KEY" -H 'Content-Type: application/json' \
                  -d "{\"lease_id\":\"$HELD_LEASE\",\"agent_id\":\"$AGENT\"}" >>/tmp/ga09-hb.log 2>&1 || true
                sleep 15
              done
              kill "$HB_PF" 2>/dev/null || true
              sleep 3
            done
          ) >>/tmp/ga09-hb.log 2>&1 &
          echo $! > /tmp/ga09-hb.pid
          echo "lease keeper started: pid $(cat /tmp/ga09-hb.pid)"
        "id": "seed_old_state"
      -
        "name": "Helm upgrade to the candidate image"
        "run": |
          set -euo pipefail
          helm upgrade "$RELEASE" "$GITHUB_WORKSPACE/deployments/helm/janus-core" \
            --namespace "$NS" \
            --set image.repository=janus-core \
            --set image.tag=candidate \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set postgres.password="$PG_PASSWORD" \
            --timeout 5m >/tmp/ga09-helm-upgrade.log 2>&1 &
          UPGRADE_PID=$!
          # The chart deletes the hook Job once it succeeds
          # (helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded),
          # so the Job can only be observed while the upgrade is in flight.
          for i in $(seq 1 60); do
            kubectl -n "$NS" get job janus-core-migration >/dev/null 2>&1 && break
            sleep 1
          done
          kubectl -n "$NS" get job janus-core-migration >/dev/null
          kubectl -n "$NS" wait --for=condition=complete job/janus-core-migration --timeout=300s
          wait "$UPGRADE_PID"
          cat /tmp/ga09-helm-upgrade.log
          kubectl -n "$NS" wait --for=condition=available deployment/janus-core --timeout=180s
          "$GITHUB_WORKSPACE/scripts/wait_pods_ready.sh" "$NS" 180s
          IMAGE=$(kubectl -n "$NS" get deployment janus-core -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "image after upgrade: $IMAGE"
          [ "$IMAGE" = "janus-core:candidate" ] || { echo "::error::upgrade did not land the candidate image ($IMAGE)"; exit 1; }
        "id": "helm_upgrade"
      -
        "name": "Assert in-flight state survived the upgrade"
        "run": |
          set -euo pipefail
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          psqlq() { kubectl -n "$NS" exec "$PG_POD" -- psql -U janus -d janus -tAc "$1"; }
          SCHEMA_NOW=$(psqlq "SELECT version FROM schema_migrations")
          DIRTY=$(psqlq "SELECT dirty FROM schema_migrations")
          echo "schema_migrations after upgrade: version=$SCHEMA_NOW dirty=$DIRTY (at install: $GA09_SCHEMA_AT_INSTALL)"
          [ "$DIRTY" = "f" ] || { echo "::error::schema_migrations is DIRTY after the upgrade hook"; exit 1; }
          [ "$SCHEMA_NOW" -ge "$GA09_SCHEMA_AT_INSTALL" ] || { echo "::error::schema version regressed across upgrade ($GA09_SCHEMA_AT_INSTALL -> $SCHEMA_NOW)"; exit 1; }
          # The held task and its lease survived the old -> candidate hop.
          HELD=$(psqlq "SELECT status FROM tasks WHERE tenant_id='$TENANT' AND id='ga09-held-1'")
          echo "held task status after upgrade: $HELD (was $GA09_HELD_STATUS)"
          [ "$HELD" = "$GA09_HELD_STATUS" ] || { echo "::error::held task status changed across upgrade: $GA09_HELD_STATUS -> $HELD"; exit 1; }
          OPEN=$(psqlq "SELECT count(*) FROM task_attempts WHERE tenant_id='$TENANT' AND lease_id='$GA09_HELD_LEASE' AND finished_at IS NULL")
          [ "$OPEN" = "1" ] || { echo "::error::held lease lost its open attempt row across upgrade (open=$OPEN)"; exit 1; }
          DONE=$(psqlq "SELECT status FROM tasks WHERE tenant_id='$TENANT' AND id='ga09-done-1'")
          [ "$DONE" = "completed" ] || { echo "::error::completed task mutated across upgrade: $DONE"; exit 1; }
          AUDIT_NOW=$(psqlq "SELECT count(*) FROM audit_event_projection WHERE tenant_id='$TENANT'")
          echo "audit_event_projection rows: $AUDIT_NOW (baseline $GA09_AUDIT_COUNT)"
          [ "$AUDIT_NOW" -ge "$GA09_AUDIT_COUNT" ] || { echo "::error::audit rows LOST across upgrade ($GA09_AUDIT_COUNT -> $AUDIT_NOW)"; exit 1; }
          kubectl -n "$NS" port-forward svc/janus-core 18082:8080 >/tmp/ga09-pf-candidate.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 5 http://127.0.0.1:18082/readyz && break
            sleep 1
          done
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18082/healthz)
          echo "candidate /healthz -> $CODE"
          [ "$CODE" = "200" ] || { echo "::error::candidate /healthz -> $CODE"; exit 1; }
          # Cross-version lease compatibility: the lease was minted by the
          # OLD binary and must settle cleanly through the candidate.
          CODE=$(curl -s -o /tmp/ga09-ack.json -w '%{http_code}' --max-time 10 -X POST "http://127.0.0.1:18082/v1/tenants/$TENANT/tasks/ga09-held-1/ack" \
            -H "x-api-key: $API_KEY" -H 'Content-Type: application/json' \
            -d "{\"lease_id\":\"$GA09_HELD_LEASE\",\"agent_id\":\"$AGENT\",\"result_ref\":\"ga09://settled-by-candidate\"}")
          echo "ack held lease via candidate -> $CODE $(cat /tmp/ga09-ack.json)"
          [ "$CODE" = "200" ] || { echo "::error::candidate could not ACK the lease minted by $OLD_TAG -> $CODE"; exit 1; }
          HELD=$(psqlq "SELECT status FROM tasks WHERE tenant_id='$TENANT' AND id='ga09-held-1'")
          [ "$HELD" = "completed" ] || { echo "::error::held task not completed after cross-version ack: $HELD"; exit 1; }
          OPEN=$(psqlq "SELECT count(*) FROM task_attempts WHERE tenant_id='$TENANT' AND lease_id='$GA09_HELD_LEASE' AND finished_at IS NULL")
          [ "$OPEN" = "0" ] || { echo "::error::ack left the attempt row open (finished_at set required)"; exit 1; }
          touch /tmp/ga09-hb.stop
        "id": "assert_upgrade"
      -
        "name": "Helm rollback to the previous revision (OLD image) + re-assert"
        "run": |
          set -euo pipefail
          # Roll back to revision 0 == the previous release (the
          # install). No migration hook fires on rollback (the chart
          # annotates pre-install,pre-upgrade only), so the app steps back
          # onto the FORWARD schema — the posture this job exists to prove.
          helm -n "$NS" rollback "$RELEASE" 0 --wait --timeout 5m
          kubectl -n "$NS" wait --for=condition=available deployment/janus-core --timeout=180s
          "$GITHUB_WORKSPACE/scripts/wait_pods_ready.sh" "$NS" 180s
          IMAGE=$(kubectl -n "$NS" get deployment janus-core -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "image after rollback: $IMAGE"
          [ "$IMAGE" = "janus-core:old" ] || { echo "::error::rollback did not restore the OLD image ($IMAGE)"; exit 1; }
          echo "=== helm history ==="
          helm -n "$NS" history "$RELEASE" | tee /tmp/ga09-helm-history.txt
          REVS=$(helm -n "$NS" history "$RELEASE" -o json | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "revisions recorded: $REVS (install -> upgrade -> rollback = 3)"
          [ "$REVS" = "3" ] || { echo "::error::helm history shows $REVS revisions (want 3)"; exit 1; }
          PG_POD=$(kubectl -n "$NS" get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          psqlq() { kubectl -n "$NS" exec "$PG_POD" -- psql -U janus -d janus -tAc "$1"; }
          SCHEMA_NOW=$(psqlq "SELECT version FROM schema_migrations")
          DIRTY=$(psqlq "SELECT dirty FROM schema_migrations")
          echo "schema_migrations after rollback: version=$SCHEMA_NOW dirty=$DIRTY"
          [ "$DIRTY" = "f" ] && [ "$SCHEMA_NOW" -ge "$GA09_SCHEMA_AT_INSTALL" ]
          # All durable business state intact on the rolled-back binary.
          DONE=$(psqlq "SELECT status FROM tasks WHERE tenant_id='$TENANT' AND id='ga09-done-1'")
          SETTLED=$(psqlq "SELECT status FROM tasks WHERE tenant_id='$TENANT' AND id='ga09-held-1'")
          echo "post-rollback rows: ga09-done-1=$DONE ga09-held-1=$SETTLED"
          [ "$DONE" = "completed" ] || { echo "::error::completed task mutated across rollback: $DONE"; exit 1; }
          [ "$SETTLED" = "completed" ] || { echo "::error::settled task mutated across rollback: $SETTLED"; exit 1; }
          AUDIT_NOW=$(psqlq "SELECT count(*) FROM audit_event_projection WHERE tenant_id='$TENANT'")
          [ "$AUDIT_NOW" -ge "$GA09_AUDIT_COUNT" ] || { echo "::error::audit rows lost across rollback ($GA09_AUDIT_COUNT -> $AUDIT_NOW)"; exit 1; }
          kubectl -n "$NS" port-forward svc/janus-core 18083:8080 >/tmp/ga09-pf-rollback.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 5 http://127.0.0.1:18083/readyz && break
            sleep 1
          done
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18083/healthz)
          echo "rolled-back /healthz -> $CODE"
          [ "$CODE" = "200" ] || { echo "::error::rolled-back OLD binary /healthz -> $CODE"; exit 1; }
          # A fresh pull must work through the rolled-back OLD binary:
          # publish a task on it and consume it end to end.
          AUTH=(-H "x-api-key: $API_KEY" -H 'Content-Type: application/json')
          CODE=$(curl -s -o /tmp/ga09-body.json -w '%{http_code}' --max-time 10 -X POST "http://127.0.0.1:18083/v1/tenants/$TENANT/tasks" "${AUTH[@]}" -d '{"id":"ga09-post-rollback-1","source_agent":"ga09-agent","target_type":"mailbox","target_value":"ga09-mb","envelope":{"janus_version":"0.3","task_id":"ga09-post-rollback-1","tenant_id":"ga09","source_agent":"ga09-agent","target":{"type":"mailbox","value":"ga09-mb"},"payload":{"type":"smoke","content":"ga09"},"trace":{"trace_id":"ga09-post-rollback-1"}}}')
          echo "POST tasks(ga09-post-rollback-1) via rolled-back OLD -> $CODE"
          [ "$CODE" = "201" ] || { echo "::error::task create through rolled-back OLD binary -> $CODE $(cat /tmp/ga09-body.json)"; exit 1; }
          GOT=""
          for i in $(seq 1 90); do
            RESP=$(curl -sf --max-time 5 -X POST "http://127.0.0.1:18083/v1/tenants/$TENANT/mailboxes/$MAILBOX/pull" "${AUTH[@]}" -d "{\"agent_id\":\"$AGENT\"}" 2>/dev/null || echo "")
            GOT=$(printf '%s' "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('task') or {}; print(t.get('id',''))" 2>/dev/null || echo "")
            [ "$GOT" = "ga09-post-rollback-1" ] && break
            sleep 1
          done
          [ "$GOT" = "ga09-post-rollback-1" ] || { echo "::error::rolled-back OLD binary never delivered the new task via pull"; exit 1; }
          echo "post-rollback pull delivered ga09-post-rollback-1"
        "id": "helm_rollback"
      -
        "name": "Stop the lease keeper"
        "if": "always()"
        "run": |
          touch /tmp/ga09-hb.stop 2>/dev/null || true
          if [ -f /tmp/ga09-hb.pid ]; then
            kill "$(cat /tmp/ga09-hb.pid)" 2>/dev/null || true
          fi
        "id": "stop_keeper"
      -
        "name": "Dump cluster state on failure"
        "if": "failure()"
        "run": |
          set -euo pipefail
          kubectl -n "$NS" get all 2>/dev/null || true
          for p in $(kubectl -n "$NS" get pods -o name 2>/dev/null); do
            echo "::group::$p"
            kubectl -n "$NS" describe "$p" 2>/dev/null | tail -n 40 || true
            kubectl -n "$NS" logs "$p" --all-containers --tail=80 2>/dev/null || true
            echo "::endgroup::"
          done
          helm -n "$NS" status "$RELEASE" 2>/dev/null || true
          helm -n "$NS" history "$RELEASE" 2>/dev/null || true
          cat /tmp/ga09-images.txt /tmp/ga09-helm-history.txt 2>/dev/null || true
          tail -n 30 /tmp/ga09-hb.log /tmp/ga09-pf-seed.log /tmp/ga09-pf-candidate.log /tmp/ga09-pf-rollback.log /tmp/ga09-body.json 2>/dev/null || true
        "id": "dump_failure"
      -
        "name": "Snapshot Kubernetes evidence before cleanup"
        "id": "kind_snapshot"
        "if": "${{ always() }}"
        "env":
          "KIND_CLUSTER": "janus-ga09"
        "run": |
          set -uo pipefail
          out="${EVIDENCE_DIR:-/tmp/janus-evidence}/kubernetes-$KIND_CLUSTER"
          mkdir -p "$out"
          # Do not dump Secrets or the runner environment into artifacts.
          kubectl version --client -o yaml > "$out/kubectl-version.yml" 2>&1 || true
          kubectl -n "$NS" get deployments,services,pods,jobs,pvc -o yaml > "$out/resources.yml" 2>&1 || true
          kubectl -n "$NS" get events --sort-by=.metadata.creationTimestamp > "$out/events.txt" 2>&1 || true
          helm -n "$NS" history "$RELEASE" -o json > "$out/helm-history.json" 2>&1 || true
          kubectl -n "$NS" get pods -o name > "$out/pods.txt" 2>/dev/null || true
          while IFS= read -r pod; do
            [ -n "$pod" ] || continue
            name="${pod#pod/}"
            kubectl -n "$NS" describe "$pod" > "$out/$name.describe.txt" 2>&1 || true
            kubectl -n "$NS" logs "$pod" --all-containers=true --timestamps=true > "$out/$name.log" 2>&1 || true
          done < "$out/pods.txt"
      -
        "name": "Delete kind cluster"
        "if": "always()"
        "run": |
          set -euo pipefail
          kind delete cluster --name janus-ga09
        "id": "delete_cluster"
      -
        "name": "Collect logs before runner cleanup"
        "id": "collect"
        "if": "${{ always() }}"
        "run": |
          set -uo pipefail
          if [[ -f "$JANUS_DIST/tools/ci.sh" ]]; then
            source "$JANUS_DIST/tools/ci.sh"
            collect_evidence
          else
            mkdir -p "$EVIDENCE_DIR"
            docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true
          fi
      -
        "name": "Write machine-readable suite result"
        "id": "result"
        "if": "${{ always() }}"
        "env":
          "STEPS_JSON": "${{ toJSON(steps) }}"
          "JOB_STATUS": "${{ job.status }}"
        "run": |
          set -euo pipefail
          if [[ -f "$JANUS_DIST/tools/finalize.py" && -f "$JANUS_DIST/manifest.json" ]]; then
            python3 "$JANUS_DIST/tools/finalize.py"
          else
            python3 - <<'JANUS_FALLBACK'
          import json, os, pathlib
          p = pathlib.Path(os.environ['EVIDENCE_DIR']); p.mkdir(parents=True, exist_ok=True)
          r = dict(suite_id=os.environ['SUITE_ID'], status='FAIL', candidate_sha=os.environ.get('CANDIDATE_SHA', ''), candidate_image_id='', problems=['candidate runtime unavailable; suite not proven'], artifact_name=os.environ['EVIDENCE_ARTIFACT'])
          (p / 'result.json').write_text(json.dumps(r, indent=2) + '\n')
          raise SystemExit(1)
          JANUS_FALLBACK
          fi
      -
        "name": "Upload ${{ env.EVIDENCE_ARTIFACT }}"
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "with":
          "name": "${{ env.EVIDENCE_ARTIFACT }}"
          "path": "/tmp/janus-evidence"
          "retention-days": 90
          "if-no-files-found": "error"
        "if": "${{ always() }}"
