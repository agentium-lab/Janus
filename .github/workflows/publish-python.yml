name: Publish Python SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Python SDK tests
        run: |
          cd sdk/python && pip install -e ".[dev]"
          python3 -m pytest tests/ -q

  pypi:
    needs: sdk-tests
    # Requires a one-time trusted-publisher registration on pypi.org:
    # project janus-broker -> this repo, workflow publish-python.yml,
    # environment pypi.
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          cd sdk/python && python -m build

      - name: Skip if version already published
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")
          if curl -sf "https://pypi.org/pypi/janus-broker/$VER/json" >/dev/null; then
            echo "janus-broker@$VER already on PyPI — skipping upload"
            echo "skip_upload=true" >> "$GITHUB_OUTPUT"
          fi
        id: published

      - name: Publish to PyPI
        if: steps.published.outputs.skip_upload != 'true' 
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
