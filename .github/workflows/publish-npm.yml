name: Publish TypeScript SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build + typecheck TypeScript SDK
        run: |
          cd sdk/typescript
          npm ci || npm install
          npx tsc --noEmit

  npm:
    needs: sdk-tests
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Build
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      # Tokenless: npm mints an OIDC token from GitHub's attestation endpoint
      # (id-token: write) and the registry-side trusted publisher authorizes
      # the upload. NPM_TOKEN is no longer used.
      - name: Publish @agentium-lab/janus-sdk
        working-directory: sdk/typescript
        run: npm publish --access public --provenance
