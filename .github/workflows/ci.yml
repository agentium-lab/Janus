name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Build all modules
        run: go build ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: go vet
        run: go vet ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck -checks 'all,-U1000,-ST1000,-ST1020,-ST1021' ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

  test:
    runs-on: ubuntu-latest
    env:
      JANUS_PG_HOST: localhost
      JANUS_PG_PORT: "5432"
      JANUS_PG_USER: janus
      JANUS_PG_PASSWORD: janus
      JANUS_PG_DATABASE: janus_test
      JANUS_PG_SSLMODE: disable
      JANUS_PG_DSN: postgres://janus:janus@localhost:5432/janus_test?sslmode=disable
      JANUS_NATS_URL: nats://localhost:4222
      JANUS_REDIS_ADDR: localhost:6379
      JANUS_INTEGRATION: "1"
      JANUS_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      # Dependency containers are started as a regular step (not the services:
      # block) so pulls can be retried — the services phase runs before any
      # step and fails hard on transient Docker Hub rate limits.
      - name: Start dependency containers
        run: |
          set -euo pipefail
          pull() {
            for src in "docker.io/$1" "public.ecr.aws/docker/library/$1"; do
              for attempt in 1 2 3; do
                docker pull "$src" && { docker tag "$src" "$1"; return 0; }
                echo "pull $src failed (attempt $attempt), backing off..."
                sleep $((attempt * 10))
              done
            done
            echo "::error::unable to pull $1 from any registry after retries"; return 1
          }
          docker version --format '{{.Server.Version}}'
          pull postgres:16-alpine
          pull nats:2-alpine
          pull redis:7-alpine

          docker run -d --name pg \
            -e POSTGRES_USER=janus -e POSTGRES_PASSWORD=janus -e POSTGRES_DB=janus_test \
            -p 5432:5432 postgres:16-alpine
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          docker run -d --name redis -p 6379:6379 redis:7-alpine

          for i in $(seq 1 60); do
            docker exec pg pg_isready -U janus >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec pg pg_isready -U janus
          until (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; do sleep 1; done
          until [ "$(docker exec redis redis-cli ping)" = "PONG" ]; do sleep 1; done

      - name: Unit tests (no infra dependency)
        run: |
          go test -count=1 -timeout=60s -cover ./core/...
          go test -count=1 -timeout=60s -cover ./server/internal/handler/...
          go test -count=1 -timeout=60s -cover ./server/internal/service/...
          go test -count=1 -timeout=60s -cover ./server/internal/grpc/...
          go test -count=1 -timeout=60s -cover ./server/internal/gateway/...
          go test -count=1 -timeout=60s -cover ./server/internal/auth/...
          go test -count=1 -timeout=60s -cover ./server/internal/expiry/...
          go test -count=1 -timeout=60s -cover ./server/internal/heartbeat/...
          go test -count=1 -timeout=60s -cover ./server/internal/outbox/...
          go test -count=1 -timeout=60s -cover ./server/internal/retry/...
          go test -count=1 -timeout=60s -cover ./server/internal/metrics/...
          go test -count=1 -timeout=60s -cover ./server/internal/config/...
          go test -count=1 -timeout=60s -cover ./sdk/go/...
          go test -count=1 -timeout=60s -cover ./cli/...
          go test -count=1 -timeout=60s -cover ./server/tests/simulation/...

      - name: E2E + integration tests (with infra)
        run: |
          go test -count=1 -timeout=300s ./server/tests/e2e/...

      - name: Postgres driver tests
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/postgres/...

      - name: NATS driver tests
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/nats/...

      - name: Redis driver tests
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/redis/...

      - name: Dump dependency logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs pg || true
          docker logs nats || true
          docker logs redis || true
