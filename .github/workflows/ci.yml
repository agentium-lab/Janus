name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Build all modules
        run: go build ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Python SDK tests
        run: |
          pip install httpx pydantic pytest
          cd sdk/python && python3 -m pytest tests/ -q

      - name: TypeScript SDK build + tests
        run: |
          cd sdk/typescript
          npm ci || npm install
          npx tsc --noEmit
          npm test --if-present

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: go vet
        run: go vet ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck -checks 'all,-U1000,-ST1000,-ST1020,-ST1021' ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

  test:
    runs-on: ubuntu-latest
    env:
      JANUS_PG_HOST: localhost
      JANUS_PG_PORT: "5432"
      JANUS_PG_USER: janus
      JANUS_PG_PASSWORD: janus
      JANUS_PG_DATABASE: janus_test
      JANUS_PG_SSLMODE: disable
      JANUS_PG_DSN: postgres://janus:janus@localhost:5432/janus_test?sslmode=disable
      JANUS_NATS_URL: nats://localhost:4222
      JANUS_REDIS_ADDR: localhost:6379
      JANUS_INTEGRATION: "1"
      JANUS_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      # Dependency containers are started as a regular step (not the services:
      # block) so pulls can be retried — the services phase runs before any
      # step and fails hard on transient Docker Hub rate limits.
      - name: Start dependency containers
        run: |
          set -euo pipefail
          pull() {
            for src in "docker.io/$1" "public.ecr.aws/docker/library/$1"; do
              for attempt in 1 2 3; do
                docker pull "$src" && { docker tag "$src" "$1"; return 0; }
                echo "pull $src failed (attempt $attempt), backing off..."
                sleep $((attempt * 10))
              done
            done
            echo "::error::unable to pull $1 from any registry after retries"; return 1
          }
          docker version --format '{{.Server.Version}}'
          pull postgres:16-alpine
          pull nats:2-alpine
          pull redis:7-alpine

          docker run -d --name pg \
            -e POSTGRES_USER=janus -e POSTGRES_PASSWORD=janus -e POSTGRES_DB=janus_test \
            -p 5432:5432 postgres:16-alpine
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          docker run -d --name redis -p 6379:6379 redis:7-alpine

          # Health checks go over explicit TCP (-h) — the default unix-socket
          # probe reports "/var/run/postgresql: no response" even when TCP is
          # fine, and its silent failures were swallowed by the wait loop.
          for i in $(seq 1 90); do
            docker exec pg pg_isready -h 127.0.0.1 -U janus >/dev/null 2>&1 && pg_ok=1 && break
            if [ "$((i % 15))" = 0 ]; then echo "--- pg logs @${i} ---"; docker logs --tail 20 pg; fi
            sleep 2
          done
          if [ "${pg_ok:-0}" != 1 ]; then
            echo "::group::pg logs (final)"; docker logs pg; echo "::endgroup::"
            echo "::error::postgres never became ready"; exit 1
          fi
          until (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; do sleep 1; done
          until [ "$(docker exec redis redis-cli ping)" = "PONG" ]; do sleep 1; done

      - name: Unit tests (no infra dependency)
        run: |
          go test -count=1 -timeout=60s -cover ./core/...
          go test -count=1 -timeout=60s -cover ./server/internal/handler/...
          go test -count=1 -timeout=60s -cover ./server/internal/service/...
          go test -count=1 -timeout=60s -cover ./server/internal/grpc/...
          go test -count=1 -timeout=60s -cover ./server/internal/gateway/...
          go test -count=1 -timeout=60s -cover ./server/internal/auth/...
          go test -count=1 -timeout=60s -cover ./server/internal/expiry/...
          go test -count=1 -timeout=60s -cover ./server/internal/heartbeat/...
          go test -count=1 -timeout=60s -cover ./server/internal/outbox/...
          go test -count=1 -timeout=60s -cover ./server/internal/retry/...
          go test -count=1 -timeout=60s -cover ./server/internal/metrics/...
          go test -count=1 -timeout=60s -cover ./server/internal/config/...
          go test -count=1 -timeout=60s -cover ./sdk/go/...
          go test -count=1 -timeout=60s -cover ./cli/...
          go test -count=1 -timeout=60s -cover ./server/tests/simulation/...
          go test -count=1 -timeout=120s -cover ./server/tests/scenario/...

      - name: E2E + integration tests (with infra)
        run: |
          go test -count=1 -timeout=300s ./server/tests/e2e/...

      - name: PG-only without Redis (typed-nil regression guard)
        run: |
          go test -count=1 -timeout=180s -v -run TestPGOnlyNoRedis ./server/tests/pgonly/...

      - name: Postgres driver tests
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/postgres/...

      - name: PostgreSQL-only boot, agent registration WITHOUT Redis
        run: |
          go build -o /tmp/janus-api-pg ./server/cmd/janus-api
          # Redis points at a dead port on purpose: this is the regression
          # guard for the typed-nil panic found in the v1.5.0 review.
          JANUS_QUEUE_DRIVER=pg \
            JANUS_PG_HOST=localhost JANUS_PG_USER=janus JANUS_PG_PASSWORD=janus \
            JANUS_PG_DATABASE=janus_test JANUS_PG_SSLMODE=disable \
            JANUS_REDIS_ADDR=localhost:59999 JANUS_MIGRATION_AUTO=true \
            JANUS_MIGRATION_PATH=migrations JANUS_AUTH_ENABLED=false \
            JANUS_HTTP_HOST=localhost JANUS_HTTP_PORT=18099 \
            /tmp/janus-api-pg 2>/tmp/pgonly.log &
          API_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:18099/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -sf http://localhost:18099/readyz || { kill $API_PID; cat /tmp/pgonly.log; echo "::error::PG-only readyz failed"; exit 1; }
          curl -sf -X POST http://localhost:18099/v1/tenants/acme/agents \
            -H 'Content-Type: application/json' \
            -d '{"id":"ci-agent","display_name":"CI Agent","protocol":"http","endpoint":"http://localhost:9"}' \
            || { kill $API_PID; cat /tmp/pgonly.log; echo "::error::agent registration panicked without Redis"; exit 1; }
          kill $API_PID
          grep -i panic /tmp/pgonly.log && { echo "::error::panic in PG-only log"; exit 1; } || true
          echo "PG-only (no NATS, no Redis) boot + agent registration verified"

      - name: Coverage gate
        run: COVERAGE_THRESHOLD=85 make coverage

      - name: Helm chart lint
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deployments/helm/janus-core

      - name: NATS driver tests
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/nats/...

      - name: Redis driver tests
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/redis/...

      - name: Dump dependency logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs pg || true
          docker logs nats || true
          docker logs redis || true
