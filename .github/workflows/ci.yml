name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Build all modules
        run: go build ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: go vet
        run: go vet ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

      - name: staticcheck
        # U1000 (unused code) and ST1000/ST1020/ST1021 (doc style) are
        # housekeeping lints, not correctness gates. See Makefile for rationale.
        run: staticcheck -checks 'all,-U1000,-ST1000,-ST1020,-ST1021' ./core/... ./server/... ./cli/... ./sdk/go/... ./proto/...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus
          POSTGRES_DB: janus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
        options: --entrypoint nats-server -- -js

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work

      - name: Unit tests (no infra dependency)
        run: |
          go test -count=1 -timeout=60s -cover ./core/...
          go test -count=1 -timeout=60s -cover ./server/internal/handler/...
          go test -count=1 -timeout=60s -cover ./server/internal/service/...
          go test -count=1 -timeout=60s -cover ./server/internal/grpc/...
          go test -count=1 -timeout=60s -cover ./server/internal/gateway/...
          go test -count=1 -timeout=60s -cover ./server/internal/auth/...
          go test -count=1 -timeout=60s -cover ./server/internal/expiry/...
          go test -count=1 -timeout=60s -cover ./server/internal/heartbeat/...
          go test -count=1 -timeout=60s -cover ./server/internal/outbox/...
          go test -count=1 -timeout=60s -cover ./server/internal/retry/...
          go test -count=1 -timeout=60s -cover ./server/internal/metrics/...
          go test -count=1 -timeout=60s -cover ./server/internal/config/...
          go test -count=1 -timeout=60s -cover ./sdk/go/...
          go test -count=1 -timeout=60s -cover ./cli/...
          go test -count=1 -timeout=60s -cover ./server/tests/simulation/...

      - name: E2E + integration tests (with infra)
        env:
          JANUS_PG_DSN: postgres://janus:janus@localhost:5432/janus_test?sslmode=disable
          JANUS_NATS_URL: nats://localhost:4222
          JANUS_REDIS_ADDR: localhost:6379
          JANUS_INTEGRATION: "1"
          JANUS_URL: http://localhost:8080
        run: |
          go test -count=1 -timeout=120s ./server/tests/e2e/...

      - name: Postgres driver tests
        env:
          JANUS_PG_HOST: localhost
          JANUS_PG_PORT: 5432
          JANUS_PG_USER: janus
          JANUS_PG_DBNAME: janus_test
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/postgres/...

      - name: NATS driver tests
        env:
          JANUS_NATS_URL: nats://localhost:4222
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/nats/...

      - name: Redis driver tests
        env:
          JANUS_REDIS_ADDR: localhost:6379
        run: go test -count=1 -timeout=60s -cover ./server/internal/driver/redis/...
