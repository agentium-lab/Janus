name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Build + vet
        run: |
          go build ./core/... ./server/... ./cli/... ./sdk/go/...
          go vet ./core/... ./server/... ./cli/... ./sdk/go/...

      - name: Core test suites (unit, scenario, e2e harness)
        run: |
          go test -count=1 -timeout=120s ./core/... ./sdk/go/... ./cli/...
          go test -count=1 -timeout=120s ./server/internal/...
          go test -count=1 -timeout=120s ./server/tests/simulation/... ./server/tests/scenario/...

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/janus-api ./server/cmd/janus-api
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/janus ./cli
          cd dist && sha256sum janus-api janus > checksums.txt

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/janus-api \
            dist/janus \
            dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  docker:
    needs: verify
    # Publishes the container image the Helm chart references
    # (ghcr.io/agentium-lab/janus-core). Without this job every helm install
    # fails on ImagePullBackOff.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/agentium-lab/janus-core:${{ github.ref_name }}
            ghcr.io/agentium-lab/janus-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
